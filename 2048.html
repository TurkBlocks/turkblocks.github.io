<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Bulmaca</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --surface-2: #141414;
            --border: #222222;
            --text: #f8f9fa;
            --text-secondary: #9ca3af;
            --primary: #500000;
            --primary-hover: #780000;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Google Sans", Arial, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        h1 { font-size: 24px; margin-bottom: 4px; }
        .subtitle { color: var(--text-secondary); font-size: 13px; margin-bottom: 16px; }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 16px;
            background: var(--surface-2);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .score-item { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; }
        .score-item span { display: block; font-size: 16px; font-weight: 700; color: var(--text); margin-top: 2px; }

        .grid-2048 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: #050505;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .tile {
            aspect-ratio: 1;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .tile-2 { background: #1e1b4b; color: #818cf8; }
        .tile-4 { background: #312e81; color: #c7d2fe; }
        .tile-8 { background: #7c2d12; color: #fed7aa; }
        .tile-16 { background: #c2410c; color: #fff; }
        .tile-32 { background: #b91c1c; color: #fff; }
        .tile-64 { background: #991b1b; color: #fff; }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>2048</h1>
        <p class="subtitle">Sayıları Birleştir</p>

        <div class="scoreboard">
            <div class="score-item">Skor <span id="score">0</span></div>
        </div>

        <div class="grid-2048" id="grid"></div>
        <button class="btn" id="restartBtn">Yeniden Başlat</button>
    </div>

    <script>
        const gridEl = document.getElementById("grid");
        const scoreEl = document.getElementById("score");
        const restartBtn = document.getElementById("restartBtn");

        let board = Array(4).fill().map(() => Array(4).fill(0));
        let score = 0;

        function initGame() {
            board = Array(4).fill().map(() => Array(4).fill(0));
            score = 0;
            scoreEl.textContent = score;
            addNewTile();
            addNewTile();
            render();
        }

        function addNewTile() {
            let empty = [];
            for(let r=0; r<4; r++) {
                for(let c=0; c<4; c++) {
                    if(board[r][c] === 0) empty.push({r, c});
                }
            }
            if(empty.length > 0) {
                let {r, c} = empty[Math.floor(Math.random() * empty.length)];
                board[r][c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function render() {
            gridEl.innerHTML = "";
            board.forEach(row => {
                row.forEach(val => {
                    const tile = document.createElement("div");
                    tile.className = `tile ${val ? 'tile-' + val : ''}`;
                    tile.textContent = val !== 0 ? val : "";
                    gridEl.appendChild(tile);
                });
            });
        }

        function slide(row) {
            let arr = row.filter(val => val);
            for(let i=0; i<arr.length-1; i++) {
                if(arr[i] === arr[i+1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr[i+1] = 0;
                }
            }
            arr = arr.filter(val => val);
            while(arr.length < 4) arr.push(0);
            return arr;
        }

        function moveLeft() {
            let moved = false;
            for(let r=0; r<4; r++) {
                let original = [...board[r]];
                board[r] = slide(board[r]);
                if(original.toString() !== board[r].toString()) moved = true;
            }
            return moved;
        }

        function rotate() {
            let newBoard = Array(4).fill().map(() => Array(4).fill(0));
            for(let r=0; r<4; r++) {
                for(let c=0; c<4; c++) {
                    newBoard[c][3 - r] = board[r][c];
                }
            }
            board = newBoard;
        }

        function handleInput(dir) {
            let moved = false;
            for(let i=0; i<dir; i++) rotate();
            moved = moveLeft();
            for(let i=0; i<(4 - dir)%4; i++) rotate();
            
            if(moved) {
                addNewTile();
                render();
                scoreEl.textContent = score;
            }
        }

        window.addEventListener("keydown", e => {
            if(e.key === "ArrowLeft") handleInput(0);
            if(e.key === "ArrowUp") handleInput(1);
            if(e.key === "ArrowRight") handleInput(2);
            if(e.key === "ArrowDown") handleInput(3);
        });

        restartBtn.addEventListener("click", initGame);
        initGame();
    </script>
</body>
</html>
