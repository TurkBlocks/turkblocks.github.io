<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renk Yakalama</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --surface-2: #141414;
            --border: #222222;
            --text: #f8f9fa;
            --text-secondary: #9ca3af;
            --primary: #500000;
            --primary-hover: #780000;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Google Sans", Arial, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        h1 { font-size: 24px; margin-bottom: 4px; }
        .subtitle { color: var(--text-secondary); font-size: 13px; margin-bottom: 16px; }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 16px;
            background: var(--surface-2);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .score-item { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; }
        .score-item span { display: block; font-size: 18px; font-weight: 700; color: var(--text); margin-top: 2px; }

        canvas {
            background: #050505;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: block;
            margin: 0 auto 16px auto;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            cursor: pointer;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Renk Yakala</h1>
        <p class="subtitle">Aynı Renkleri Eşleştir</p>

        <div class="scoreboard">
            <div class="score-item">Skor <span id="score">0</span></div>
            <div class="score-item">Can <span id="lives">3</span></div>
        </div>

        <canvas id="gameCanvas" width="320" height="400"></canvas>
        <button class="btn" id="startBtn">Oyunu Başlat</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const livesEl = document.getElementById("lives");
        const startBtn = document.getElementById("startBtn");

        const colors = ["#ef4444", "#3b82f6", "#22c55e", "#eab308"];
        let score = 0;
        let lives = 3;
        let isPlaying = false;

        let player = {
            x: 130,
            y: 360,
            width: 60,
            height: 16,
            colorIndex: 0
        };

        let balls = [];

        function startGame() {
            score = 0;
            lives = 3;
            scoreEl.textContent = score;
            livesEl.textContent = lives;
            balls = [];
            isPlaying = true;
            loop();
        }

        function changePlayerColor() {
            player.colorIndex = (player.colorIndex + 1) % colors.length;
        }

        canvas.addEventListener("click", changePlayerColor);
        window.addEventListener("keydown", e => {
            if(e.code === "Space") {
                changePlayerColor();
                e.preventDefault();
            }
        });

        function spawnBall() {
            let colorIdx = Math.floor(Math.random() * colors.length);
            balls.push({
                x: Math.random() * (canvas.width - 20) + 10,
                y: -20,
                radius: 10,
                colorIndex: colorIdx,
                speed: 2.5 + Math.random() * 1.5
            });
        }

        function update() {
            if (!isPlaying) return;

            if (Math.random() < 0.03) {
                spawnBall();
            }

            for (let i = balls.length - 1; i >= 0; i--) {
                balls[i].y += balls[i].speed;

                // Yakalama kontrolü
                if (
                    balls[i].y + balls[i].radius >= player.y &&
                    balls[i].x >= player.x && balls[i].x <= player.x + player.width
                ) {
                    if (balls[i].colorIndex === player.colorIndex) {
                        score += 10;
                        scoreEl.textContent = score;
                    } else {
                        lives--;
                        livesEl.textContent = lives;
                        if (lives <= 0) {
                            isPlaying = false;
                            alert("Oyun Bitti! Skorun: " + score);
                        }
                    }
                    balls.splice(i, 1);
                    continue;
                }

                // Kaçırılan toplar
                if (balls[i].y > canvas.height) {
                    balls.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.fillStyle = "#050505";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Oyuncu çubuğu
            ctx.fillStyle = colors[player.colorIndex];
            ctx.shadowBlur = 10;
            ctx.shadowColor = colors[player.colorIndex];
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowBlur = 0;

            // Düşen toplar
            balls.forEach(b => {
                ctx.fillStyle = colors[b.colorIndex];
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function loop() {
            update();
            draw();
            if (isPlaying) requestAnimationFrame(loop);
        }

        canvas.addEventListener("mousemove", e => {
            let rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            player.x = mouseX - player.width / 2;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        });

        startBtn.addEventListener("click", startGame);
        draw();
    </script>
</body>
</html>
