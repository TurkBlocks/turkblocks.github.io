<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>tPanel — Giriş</title>

    <!-- Google Sans -->
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --red: #500000;
            --red-hover: #680000;

            --bg: #f5f5f5;
            --card: #ffffff;
            --text: #111111;
            --muted: #666666;
            --border: #dddddd;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d0d0d;
                --card: #151515;
                --text: #ffffff;
                --muted: #a0a0a0;
                --border: #2a2a2a;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background: var(--bg);
            color: var(--text);

            font-family: "Google Sans", Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;

            padding: 38px;

            background: var(--card);

            border: 1px solid var(--border);
            border-radius: 22px;

            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10);

            text-align: center;
        }

        .logo {
            width: 72px;
            height: 72px;

            object-fit: contain;

            margin-bottom: 20px;
        }

        h1 {
            margin: 0;

            font-size: 28px;
            font-weight: 700;
        }

        .description {
            margin: 10px 0 28px;

            color: var(--muted);

            font-size: 15px;
            line-height: 1.5;
        }

        .google-button {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            padding: 14px 18px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: var(--card);
            color: var(--text);

            font-family: inherit;
            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                border-color 0.15s ease;
        }

        .google-button:hover {
            transform: translateY(-2px);

            border-color: var(--red);

            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.10);
        }

        .google-button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .status {
            min-height: 20px;

            margin-top: 18px;

            color: var(--muted);

            font-size: 13px;
        }

        .back {
            display: inline-block;

            margin-top: 22px;

            color: var(--muted);

            font-size: 13px;
            text-decoration: none;
        }

        .back:hover {
            color: var(--red);
        }
    </style>
</head>

<body>

    <main class="login-card">

        <img
            class="logo"
            src="https://turkblocks.github.io/turkblockslogo6.png"
            alt="TürkBlocks"
        >

        <h1>tPanel</h1>

        <p class="description">
            Oyunlarını yönetmek için Google hesabınla giriş yap.
        </p>

        <button
            id="googleLogin"
            class="google-button"
            type="button"
        >
            <svg
                class="google-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    fill="#4285F4"
                    d="M21.35 12.27c0-.79-.07-1.55-.22-2.27H12v4.3h5.23a4.47 4.47 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.92-4.18 2.92-7.42z"
                />
                <path
                    fill="#34A853"
                    d="M12 21.6c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.6z"
                />
                <path
                    fill="#FBBC05"
                    d="M6.54 13.68A5.86 5.86 0 0 1 6.23 12c0-.58.1-1.15.31-1.68V7.79H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.21l3.24-2.53z"
                />
                <path
                    fill="#EA4335"
                    d="M12 6.29c1.43 0 2.72.49 3.74 1.46l2.8-2.8C16.83 3.39 14.63 2.4 12 2.4a9.74 9.74 0 0 0-8.7 5.39l3.24 2.53C7.31 8.01 9.46 6.29 12 6.29z"
                />
            </svg>

            Google ile giriş yap
        </button>

        <div id="status" class="status"></div>

        <a
            class="back"
            href="https://turkblocks.github.io/"
        >
            TürkBlocks ana sayfasına dön
        </a>

    </main>

    <!-- Firebase -->
    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
            onAuthStateChanged
        }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


        // ==========================================
        // FIREBASE CONFIG
        // ==========================================

        const firebaseConfig = {

            apiKey: "BURAYA_API_KEY",

            authDomain: "turkblocks-8540.firebaseapp.com",

            projectId: "turkblocks-8540",

            appId: "1:1025065211121:web:2c94856d608f2822260550"

        };


        // ==========================================
        // FIREBASE BAŞLAT
        // ==========================================

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const provider = new GoogleAuthProvider();


        // ==========================================
        // ELEMENTLER
        // ==========================================

        const loginButton =
            document.getElementById("googleLogin");

        const status =
            document.getElementById("status");


        // ==========================================
        // ZATEN GİRİŞ YAPILMIŞ MI?
        // ==========================================

        onAuthStateChanged(auth, (user) => {

            if (user) {

                window.location.href = "index.html";

            }

        });


        // ==========================================
        // GOOGLE İLE GİRİŞ
        // ==========================================

        loginButton.addEventListener("click", async () => {

            loginButton.disabled = true;

            status.textContent =
                "Google hesabı açılıyor...";

            try {

                await signInWithPopup(auth, provider);

                status.textContent =
                    "Giriş başarılı, tPanel açılıyor...";

                window.location.href = "index.html";

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Giriş yapılamadı. Lütfen tekrar deneyin.";

                loginButton.disabled = false;

            }

        });

    </script>

</body>
</html>
