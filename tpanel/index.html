<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TürkBlocks — tPanel</title>

    <meta
        name="description"
        content="TürkBlocks tPanel — TBP yönetimi"
    >

    <style>
        :root {
            --red: #500000;
            --red-hover: #680000;

            --bg: #0b0b0d;
            --card: #121214;
            --card-2: #18181b;

            --border: rgba(255,255,255,0.08);

            --text: #f5f5f5;
            --muted: #a1a1aa;

            --success: #22c55e;
            --danger: #ef4444;

            --radius: 18px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    rgba(80,0,0,0.22),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                "Google Sans",
                "Segoe UI",
                Arial,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;
        }

        button,
        input {
            font: inherit;
        }

        .panel {
            width: 100%;
            max-width: 620px;
        }

        /* ================================
           HEADER
        ================================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 46px;
            height: 46px;

            object-fit: contain;

            border-radius: 12px;
        }

        .brand-text h1 {
            margin: 0;

            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .brand-text p {
            margin: 3px 0 0;

            font-size: 13px;
            color: var(--muted);
        }

        /* ================================
           USER
        ================================= */

        .user {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 7px 10px;

            border: 1px solid var(--border);
            border-radius: 999px;

            background: rgba(255,255,255,0.035);
        }

        .user img {
            width: 31px;
            height: 31px;

            border-radius: 50%;
            object-fit: cover;
        }

        .user span {
            max-width: 170px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            font-size: 12px;
            color: #d4d4d8;
        }

        /* ================================
           MAIN CARD
        ================================= */

        .card {
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.045),
                    rgba(255,255,255,0.018)
                );

            border: 1px solid var(--border);

            border-radius: var(--radius);

            padding: 28px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.35);

            backdrop-filter: blur(14px);
        }

        .title {
            margin-bottom: 22px;
        }

        .title h2 {
            margin: 0;

            font-size: 25px;
            letter-spacing: -0.6px;
        }

        .title p {
            margin: 7px 0 0;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.5;
        }

        /* ================================
           ACTIONS
        ================================= */

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        .action {
            position: relative;

            min-height: 145px;

            border: 1px solid var(--border);
            border-radius: 16px;

            padding: 20px;

            background: var(--card);

            cursor: pointer;

            transition:
                transform 0.18s ease,
                border-color 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease;

            text-align: left;

            color: var(--text);
        }

        .action:hover {
            transform: translateY(-3px);

            border-color:
                rgba(128, 20, 20, 0.7);

            background: var(--card-2);

            box-shadow:
                0 12px 30px rgba(0,0,0,0.25);
        }

        .action:active {
            transform: translateY(-1px);
        }

        .action:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .action-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                rgba(80,0,0,0.25);

            border: 1px solid
                rgba(128,20,20,0.3);

            margin-bottom: 18px;

            font-size: 19px;
            font-weight: 700;
        }

        .action h3 {
            margin: 0 0 6px;

            font-size: 16px;
        }

        .action p {
            margin: 0;

            color: var(--muted);

            font-size: 12px;
            line-height: 1.45;
        }

        /* ================================
           STATUS
        ================================= */

        .status {
            display: none;

            margin-top: 16px;

            padding: 13px 15px;

            border-radius: 12px;

            font-size: 13px;
            line-height: 1.4;
        }

        .status.show {
            display: block;
        }

        .status.success {
            color: #bbf7d0;

            background:
                rgba(34,197,94,0.09);

            border:
                1px solid rgba(34,197,94,0.22);
        }

        .status.error {
            color: #fecaca;

            background:
                rgba(239,68,68,0.09);

            border:
                1px solid rgba(239,68,68,0.22);
        }

        .status.loading {
            color: #e4e4e7;

            background:
                rgba(255,255,255,0.045);

            border:
                1px solid var(--border);
        }

        /* ================================
           FOOTER
        ================================= */

        .footer {
            margin-top: 17px;

            text-align: center;

            color: #71717a;

            font-size: 11px;
        }

        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 600px) {

            body {
                padding: 14px;
            }

            .header {
                align-items: flex-start;
                gap: 12px;
            }

            .user span {
                display: none;
            }

            .card {
                padding: 20px;
            }

            .actions {
                grid-template-columns: 1fr;
            }

            .action {
                min-height: 125px;
            }
        }
    </style>
</head>

<body>

<div class="panel">

    <header class="header">

        <div class="brand">

            <img
                class="logo"
                src="https://turkblocks.github.io/turkblockslogo6.png"
                alt="TürkBlocks"
            >

            <div class="brand-text">

                <h1>TürkBlocks</h1>

                <p>tPanel</p>

            </div>

        </div>

        <div class="user">

            <img
                id="userPhoto"
                src=""
                alt="Profil"
            >

            <span id="userEmail">
                Yükleniyor...
            </span>

        </div>

    </header>


    <main class="card">

        <div class="title">

            <h2>Oyun Yönetimi</h2>

            <p>
                Oyununun TBP dosyasını buradan
                güncelleyebilir veya silebilirsin.
            </p>

        </div>


        <div class="actions">

            <!-- TBP SİL -->

            <button
                class="action"
                id="deleteButton"
                type="button"
            >

                <div
                    class="action-icon"
                    aria-hidden="true"
                >
                    −
                </div>

                <h3>TBP Sil</h3>

                <p>
                    Hesabına bağlı mevcut TBP
                    dosyasını GitHub'dan kaldır.
                </p>

            </button>


            <!-- TBP GÜNCELLE -->

            <button
                class="action"
                id="updateButton"
                type="button"
            >

                <div
                    class="action-icon"
                    aria-hidden="true"
                >
                    ↻
                </div>

                <h3>TBP Güncelle</h3>

                <p>
                    Yeni bir TBP seçerek mevcut
                    oyunun dosyasını güncelle.
                </p>

            </button>

        </div>


        <input
            type="file"
            id="fileInput"
            accept=".tbp"
            hidden
        >


        <div
            id="status"
            class="status"
            role="status"
            aria-live="polite"
        ></div>

    </main>


    <footer class="footer">
        TürkBlocks tPanel
    </footer>

</div>


<script type="module">

    import {
        initializeApp
    } from
        "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    } from
        "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    // ==========================================
    // FIREBASE
    // ==========================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyDR1Z_oUJ1iA_xn1nOUVt2U56ll94ilxxQ",

        authDomain:
            "turkblocks-8540.firebaseapp.com",

        projectId:
            "turkblocks-8540",

        storageBucket:
            "turkblocks-8540.firebasestorage.app",

        messagingSenderId:
            "1025065211121",

        appId:
            "1:1025065211121:web:2c94856d608f2822260550",

        measurementId:
            "G-N9FV48EQ9V"
    };


    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);


    // ==========================================
    // APPS SCRIPT
    // ==========================================

    const TBP_SIL_URL =
        "https://script.google.com/macros/s/AKfycbwx6w_KU8PMIYRHw41RcJDEh1JEw0p0nYDyd7Omc-5x2Lka5TN0gFmMoL2vq-6ntAqezA/exec";

    const TBP_GUNCELLE_URL =
        "https://script.google.com/macros/s/AKfycbykDkGYd_kJFcfrK8JCmZVxBospFbUBGgJtrK2OLbA00RepsT7L4aF8ElN5SQAzcqRM/exec";


    // ==========================================
    // AYARLAR
    // ==========================================

    const MAX_TBP_SIZE =
        35 * 1024 * 1024;

    const REQUEST_TIMEOUT =
        30000;


    // ==========================================
    // ELEMENTLER
    // ==========================================

    const userEmail =
        document.getElementById("userEmail");

    const userPhoto =
        document.getElementById("userPhoto");

    const deleteButton =
        document.getElementById("deleteButton");

    const updateButton =
        document.getElementById("updateButton");

    const fileInput =
        document.getElementById("fileInput");

    const statusBox =
        document.getElementById("status");


    let currentUser = null;


    // ==========================================
    // DURUM
    // ==========================================

    function showStatus(
        message,
        type = "success"
    ) {

        statusBox.textContent =
            String(message);

        statusBox.className =
            "status show " + type;
    }


    function clearStatus() {

        statusBox.textContent = "";

        statusBox.className =
            "status";
    }


    // ==========================================
    // BUTTON DURUMU
    // ==========================================

    function setButtonsDisabled(disabled) {

        deleteButton.disabled =
            disabled;

        updateButton.disabled =
            disabled;
    }


    // ==========================================
    // GÜVENLİ JSON İSTEĞİ
    // ==========================================

    async function requestJSON(
        url,
        body
    ) {

        const controller =
            new AbortController();

        const timeout =
            setTimeout(
                () => controller.abort(),
                REQUEST_TIMEOUT
            );

        try {

            const response =
                await fetch(
                    url,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "text/plain;charset=utf-8"
                        },

                        body:
                            JSON.stringify(body),

                        signal:
                            controller.signal
                    }
                );


            const text =
                await response.text();


            let result;

            try {

                result =
                    JSON.parse(text);

            } catch {

                throw new Error(
                    "Sunucudan geçersiz yanıt alındı."
                );
            }


            if (!response.ok) {

                throw new Error(
                    result.error ||
                    "Sunucu isteği reddetti."
                );
            }


            return result;

        } catch (error) {

            if (
                error.name ===
                "AbortError"
            ) {

                throw new Error(
                    "İstek zaman aşımına uğradı."
                );
            }

            throw error;

        } finally {

            clearTimeout(timeout);
        }
    }


    // ==========================================
    // AUTH
    // ==========================================

    onAuthStateChanged(
        auth,
        (user) => {

            if (!user) {

                currentUser = null;

                window.location.replace(
                    "login.html"
                );

                return;
            }


            currentUser = user;


            userEmail.textContent =
                user.email || "Hesap";


            if (user.photoURL) {

                userPhoto.src =
                    user.photoURL;

            } else {

                userPhoto.src =
                    "https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg";
            }

        }
    );


    // ==========================================
    // TBP SİL
    // ==========================================

    deleteButton.addEventListener(
        "click",
        async () => {

            if (!currentUser) {

                showStatus(
                    "Oturum bulunamadı.",
                    "error"
                );

                return;
            }


            const confirmed =
                window.confirm(
                    "Hesabına bağlı TBP dosyasını silmek istediğine emin misin?"
                );


            if (!confirmed) {
                return;
            }


            setButtonsDisabled(true);


            showStatus(
                "TBP siliniyor...",
                "loading"
            );


            try {

                const result =
                    await requestJSON(
                        TBP_SIL_URL,
                        {
                            email:
                                currentUser.email
                        }
                    );


                if (
                    !result ||
                    result.success !== true
                ) {

                    throw new Error(
                        result?.error ||
                        "TBP silinemedi."
                    );
                }


                showStatus(
                    "TBP silindi.",
                    "success"
                );


            } catch (error) {

                console.error(
                    "TBP silme hatası:",
                    error
                );


                showStatus(
                    "TBP silinemedi: " +
                    error.message,
                    "error"
                );

            } finally {

                setButtonsDisabled(false);
            }

        }
    );


    // ==========================================
    // TBP GÜNCELLE
    // ==========================================

    updateButton.addEventListener(
        "click",
        () => {

            if (!currentUser) {

                showStatus(
                    "Oturum bulunamadı.",
                    "error"
                );

                return;
            }


            clearStatus();

            fileInput.click();
        }
    );


    fileInput.addEventListener(
        "change",
        async () => {

            const file =
                fileInput.files?.[0];


            if (!file) {
                return;
            }


            const fileName =
                file.name.trim();


            // ==================================
            // DOSYA ADI
            // ==================================

            if (
                !fileName
                    .toLowerCase()
                    .endsWith(".tbp")
            ) {

                showStatus(
                    "Sadece .tbp dosyaları kullanılabilir.",
                    "error"
                );

                fileInput.value = "";

                return;
            }


            // ==================================
            // DOSYA BOYUTU
            // ==================================

            if (
                file.size >
                MAX_TBP_SIZE
            ) {

                showStatus(
                    "TBP dosyası 35 MB'dan büyük olamaz.",
                    "error"
                );

                fileInput.value = "";

                return;
            }


            if (
                file.size === 0
            ) {

                showStatus(
                    "Boş bir TBP dosyası yüklenemez.",
                    "error"
                );

                fileInput.value = "";

                return;
            }


            if (!currentUser) {

                showStatus(
                    "Oturum bulunamadı.",
                    "error"
                );

                fileInput.value = "";

                return;
            }


            setButtonsDisabled(true);


            showStatus(
                "TBP hazırlanıyor...",
                "loading"
            );


            try {

                const base64Data =
                    await fileToBase64(file);


                showStatus(
                    "TBP güncelleniyor...",
                    "loading"
                );


                const result =
                    await requestJSON(
                        TBP_GUNCELLE_URL,
                        {
                            email:
                                currentUser.email,

                            fileName:
                                fileName,

                            base64Data:
                                base64Data
                        }
                    );


                if (
                    !result ||
                    result.success !== true
                ) {

                    throw new Error(
                        result?.error ||
                        "TBP güncellenemedi."
                    );
                }


                showStatus(
                    "TBP değiştirildi.",
                    "success"
                );


            } catch (error) {

                console.error(
                    "TBP güncelleme hatası:",
                    error
                );


                showStatus(
                    "TBP güncellenemedi: " +
                    error.message,
                    "error"
                );

            } finally {

                setButtonsDisabled(false);

                fileInput.value = "";
            }

        }
    );


    // ==========================================
    // DOSYA → BASE64
    // ==========================================

    function fileToBase64(file) {

        return new Promise(
            (resolve, reject) => {

                const reader =
                    new FileReader();


                reader.onload = () => {

                    const result =
                        reader.result;


                    if (
                        typeof result !==
                        "string"
                    ) {

                        reject(
                            new Error(
                                "Dosya verisi okunamadı."
                            )
                        );

                        return;
                    }


                    const comma =
                        result.indexOf(",");


                    if (comma === -1) {

                        reject(
                            new Error(
                                "Dosya verisi geçersiz."
                            )
                        );

                        return;
                    }


                    resolve(
                        result.slice(
                            comma + 1
                        )
                    );
                };


                reader.onerror = () => {

                    reject(
                        new Error(
                            "Dosya okunamadı."
                        )
                    );
                };


                reader.onabort = () => {

                    reject(
                        new Error(
                            "Dosya okuma işlemi iptal edildi."
                        )
                    );
                };


                reader.readAsDataURL(file);
            }
        );
    }

</script>

</body>
</html>
