<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TÜRKBLOCKS</title>

    <!-- Google Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            color-scheme: light dark;

            --bg: #000000;
            --surface: #111111;
            --surface-hover: #181818;
            --text: #ffffff;
            --muted: #a5a5a5;
            --border: #292929;
            --accent: #500000;
            --accent-hover: #700000;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f7f7f7;
                --surface: #ffffff;
                --surface-hover: #eeeeee;
                --text: #111111;
                --muted: #666666;
                --border: #dddddd;
                --accent: #500000;
                --accent-hover: #680000;
            }
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: "Google Sans", Arial, sans-serif;
            overflow-x: hidden;
        }

        button,
        input {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================================================
           AÇILIŞ EKRANI
        ========================================================= */

        #intro {
            position: fixed;
            inset: 0;
            z-index: 9999;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: var(--bg);

            transition:
                opacity .65s ease,
                visibility .65s ease;
        }

        #intro.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .intro-brand {
            display: flex;
            align-items: center;
            gap: 15px;

            margin-bottom: 35px;

            font-size: clamp(32px, 7vw, 72px);
            font-weight: 700;
            letter-spacing: -2px;
        }

        .intro-logo {
            width: clamp(45px, 7vw, 75px);
            height: clamp(45px, 7vw, 75px);
            object-fit: contain;
        }

        /* Yükleme barı */

        .loading-container {
            width: min(420px, 70vw);
        }

        .loading-background {
            width: 100%;
            height: 5px;

            overflow: hidden;

            border-radius: 999px;
            background: var(--border);
        }

        .loading-bar {
            width: 0%;
            height: 100%;

            border-radius: inherit;

            background: var(--accent);

            transition: width .15s linear;
        }

        .loading-text {
            margin-top: 11px;

            color: var(--muted);
            text-align: center;

            font-size: 13px;
        }

        /* =========================================================
           ÜST MENÜ
        ========================================================= */

        header {
            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            min-height: 76px;
            padding: 14px 28px;

            background: color-mix(
                in srgb,
                var(--bg) 88%,
                transparent
            );

            backdrop-filter: blur(18px);

            border-bottom: 1px solid var(--border);
        }

        /* Logo + TÜRKBLOCKS */

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;

            font-size: 21px;
            font-weight: 700;
            letter-spacing: 1px;

            white-space: nowrap;
        }

        .brand-logo {
            width: 35px;
            height: 35px;

            object-fit: contain;
        }

        /*
         * RGB efekti:
         * Renk soldan sağa doğru akar.
         */

        .brand-text {
            position: relative;

            color: var(--text);

            transition:
                color .25s ease,
                text-shadow .25s ease;
        }

        .brand-text::after {
            content: "TÜRKBLOCKS";

            position: absolute;
            inset: 0;

            color: transparent;

            background:
                linear-gradient(
                    90deg,
                    #ff0000,
                    #ff7a00,
                    #ffff00,
                    #00ff55,
                    #00c8ff,
                    #3d5cff,
                    #b400ff,
                    #ff008c,
                    #ff0000
                );

            background-size: 300% 100%;
            background-position: 0% 50%;

            background-clip: text;
            -webkit-background-clip: text;

            opacity: 0;

            transition: opacity .25s ease;

            pointer-events: none;
        }

        .brand:hover .brand-text::after {
            opacity: 1;
            animation: rgbLeftToRight 2.5s linear infinite;
        }

        .brand:hover .brand-text {
            color: transparent;
        }

        @keyframes rgbLeftToRight {
            from {
                background-position: 0% 50%;
            }

            to {
                background-position: 300% 50%;
            }
        }

        /* Arama butonu */

        .search-button {
            padding: 10px 18px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: var(--surface);
            color: var(--text);

            cursor: pointer;

            transition:
                background .2s ease,
                border-color .2s ease,
                transform .2s ease;
        }

        .search-button:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
        }

        .search-button:active {
            transform: scale(.96);
        }

        /* =========================================================
           ARAMA OVERLAY
        ========================================================= */

        #search-overlay {
            position: fixed;
            inset: 0;
            z-index: 500;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, .55);
            backdrop-filter: blur(10px);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity .35s ease,
                visibility .35s ease;
        }

        #search-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .search-box {
            width: min(700px, calc(100% - 35px));

            transform: translateY(-70px) scale(.92);

            transition:
                transform .45s cubic-bezier(.2, .8, .2, 1);
        }

        #search-overlay.active .search-box {
            transform: translateY(0) scale(1);
        }

        .search-input {
            width: 100%;

            padding: 20px 23px;

            border: 1px solid var(--border);
            border-radius: 18px;

            outline: none;

            background: var(--surface);
            color: var(--text);

            font-size: 20px;

            box-shadow:
                0 20px 70px rgba(0, 0, 0, .35);

            transition: border-color .2s ease;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        /* =========================================================
           ANA İÇERİK
        ========================================================= */

        main {
            width: min(1400px, calc(100% - 40px));

            margin: 0 auto;

            padding: 48px 0 70px;
        }

        .hero {
            margin-bottom: 35px;
        }

        .hero h1 {
            margin: 0 0 9px;

            font-size: clamp(30px, 5vw, 48px);
            letter-spacing: -1.5px;
        }

        .hero p {
            margin: 0;

            color: var(--muted);

            font-size: 16px;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .section-title h2 {
            margin: 0;

            font-size: 25px;
        }

        #game-count {
            color: var(--muted);
            font-size: 14px;
        }

        /* =========================================================
           OYUNLAR
        ========================================================= */

        #games {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(210px, 1fr));

            gap: 18px;
        }

        /*
         * Oyun kartlarında RESİM YOK.
         */

        .game {
            display: flex;
            flex-direction: column;

            min-height: 145px;

            padding: 20px;

            border: 1px solid var(--border);
            border-radius: 16px;

            background: var(--surface);

            cursor: pointer;

            transition:
                transform .2s ease,
                background .2s ease,
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .game:hover {
            transform: translateY(-4px);

            background: var(--surface-hover);

            border-color: var(--accent);

            box-shadow:
                0 10px 35px rgba(80, 0, 0, .18);
        }

        .game:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .game-name {
            margin: 0;

            overflow: hidden;

            font-size: 18px;
            font-weight: 600;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .game-type {
            margin-top: 9px;

            color: var(--muted);

            font-size: 13px;
        }

        .game-open {
            margin-top: auto;
            padding-top: 22px;

            color: var(--muted);

            font-size: 13px;

            transition: color .2s ease;
        }

        .game:hover .game-open {
            color: var(--text);
        }

        /* Durum */

        .status {
            grid-column: 1 / -1;

            padding: 55px 20px;

            color: var(--muted);

            text-align: center;
        }

        .error {
            color: #d88;
        }

        /* =========================================================
           FOOTER
        ========================================================= */

        footer {
            padding: 25px 20px 35px;

            border-top: 1px solid var(--border);

            color: var(--muted);

            text-align: center;

            font-size: 13px;
        }

        /* =========================================================
           MOBİL
        ========================================================= */

        @media (max-width: 650px) {
            header {
                padding: 12px 16px;
            }

            .brand {
                font-size: 17px;
            }

            .brand-logo {
                width: 30px;
                height: 30px;
            }

            .search-button {
                padding: 9px 13px;
            }

            main {
                width: calc(100% - 28px);
                padding-top: 32px;
            }

            #games {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 12px;
            }

            .game {
                min-height: 135px;
                padding: 15px;
            }
        }

        @media (max-width: 390px) {
            #games {
                grid-template-columns: 1fr;
            }
        }

        /* Hareket azaltma */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         AÇILIŞ
    ========================================================== -->

    <div id="intro">

        <div class="intro-brand">

            <img
                class="intro-logo"
                src="https://turkblocks.gamer.gd/logo/6642781985798787256865186887954381688697668781534687987679868154396796545368967453.png"
                alt="TürkBlocks"
            >

            <span>TÜRKBLOCKS</span>

        </div>

        <div class="loading-container">

            <div class="loading-background">
                <div id="loading-bar" class="loading-bar"></div>
            </div>

            <div id="loading-text" class="loading-text">
                Yükleniyor...
            </div>

        </div>

    </div>


    <!-- =========================================================
         ARAMA
    ========================================================== -->

    <div id="search-overlay">

        <div class="search-box">

            <input
                id="search-input"
                class="search-input"
                type="search"
                placeholder="Oyun ara..."
                autocomplete="off"
                aria-label="Oyun ara"
            >

        </div>

    </div>


    <!-- =========================================================
         HEADER
    ========================================================== -->

    <header>

        <a class="brand" href="/">

            <img
                class="brand-logo"
                src="https://turkblocks.gamer.gd/logo/6642781985798787256865186887954381688697668781534687987679868154396796545368967453.png"
                alt="TürkBlocks"
            >

            <span class="brand-text">TÜRKBLOCKS</span>

        </a>


        <button
            id="search-button"
            class="search-button"
            type="button"
        >
            Ara
        </button>

    </header>


    <!-- =========================================================
         ANA İÇERİK
    ========================================================== -->

    <main>

        <section class="hero">

            <h1>Oyunlar</h1>

            <p>
                TürkBlocks oyunlarını keşfet.
            </p>

        </section>


        <section>

            <div class="section-title">

                <h2>Keşfet</h2>

                <span id="game-count">
                    Yükleniyor...
                </span>

            </div>


            <div id="games">

                <div class="status">
                    Oyunlar yükleniyor...
                </div>

            </div>

        </section>

    </main>


    <footer>
        © TürkBlocks
    </footer>


    <script>
        /* =========================================================
           AYARLAR
        ========================================================== */

        const API_URL =
            "https://api.github.com/repos/TurkBlocks/TurkBlocksGamesDepo/contents/";

        const RAW_BASE =
            "https://raw.githubusercontent.com/TurkBlocks/TurkBlocksGamesDepo/";

        const DOWNLOAD_URL =
            "https://turkblocks.gamer.gd/download/";

        /* =========================================================
           ELEMENTLER
        ========================================================== */

        const intro =
            document.getElementById("intro");

        const loadingBar =
            document.getElementById("loading-bar");

        const loadingText =
            document.getElementById("loading-text");

        const gamesContainer =
            document.getElementById("games");

        const gameCount =
            document.getElementById("game-count");

        const searchButton =
            document.getElementById("search-button");

        const searchOverlay =
            document.getElementById("search-overlay");

        const searchInput =
            document.getElementById("search-input");


        let games = [];


        /* =========================================================
           YÜKLEME ANİMASYONU
        ========================================================== */

        function updateLoading(percent, text) {

            loadingBar.style.width = percent + "%";

            loadingText.textContent = text;
        }


        /*
         * Sayfanın ilk açılışında yükleme süreci.
         *
         * Oyunlar gerçekten API'den yüklenirken bar da ilerler.
         */

        async function startPage() {

            updateLoading(10, "TürkBlocks başlatılıyor...");

            await wait(350);

            updateLoading(30, "Oyunlar aranıyor...");

            const gamePromise = loadGames();

            updateLoading(55, "Oyun listesi alınıyor...");

            await gamePromise;

            updateLoading(80, "Oyunlar hazırlanıyor...");

            await wait(350);

            updateLoading(100, "Hazır!");

            await wait(500);

            intro.classList.add("hidden");
        }


        function wait(ms) {

            return new Promise(resolve =>
                setTimeout(resolve, ms)
            );
        }


        /* =========================================================
           GITHUB API
        ========================================================== */

        async function getRepositoryContents(path = "") {

            const response = await fetch(
                API_URL + path,
                {
                    headers: {
                        "Accept":
                            "application/vnd.github+json"
                    }
                }
            );

            if (!response.ok) {

                throw new Error(
                    "GitHub API HTTP " +
                    response.status
                );
            }

            return await response.json();
        }


        /* =========================================================
           OYUN ADI
        ========================================================== */

        function cleanGameName(name) {

            return name
                .replace(/\.pck$/i, "")
                .replace(/[-_]+/g, " ")
                .trim();
        }


        /* =========================================================
           OYUN KARTI
        ========================================================== */

        function createGameCard(game) {

            const card =
                document.createElement("article");

            card.className = "game";

            card.tabIndex = 0;


            const name =
                document.createElement("h3");

            name.className = "game-name";

            name.textContent =
                cleanGameName(game.name);


            const type =
                document.createElement("div");

            type.className = "game-type";

            type.textContent =
                game.type === "dir"
                    ? "Oyun"
                    : "TürkBlocks Oyunu";


            const open =
                document.createElement("div");

            open.className = "game-open";

            open.textContent =
                "Oyunu görüntüle";


            card.appendChild(name);
            card.appendChild(type);
            card.appendChild(open);


            card.addEventListener(
                "click",
                () => {
                    window.location.href =
                        DOWNLOAD_URL;
                }
            );


            card.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Enter" ||
                        event.key === " "
                    ) {

                        event.preventDefault();

                        window.location.href =
                            DOWNLOAD_URL;
                    }
                }
            );


            return card;
        }


        /* =========================================================
           OYUNLARI GÖSTER
        ========================================================== */

        function renderGames(list) {

            gamesContainer.innerHTML = "";


            if (list.length === 0) {

                gamesContainer.innerHTML = `
                    <div class="status">
                        Aradığın oyun bulunamadı.
                    </div>
                `;

                gameCount.textContent =
                    "0 oyun";

                return;
            }


            const fragment =
                document.createDocumentFragment();


            list.forEach(game => {

                fragment.appendChild(
                    createGameCard(game)
                );

            });


            gamesContainer.appendChild(
                fragment
            );


            gameCount.textContent =
                `${list.length} oyun`;
        }


        /* =========================================================
           OYUNLARI GITHUB'TAN AL
        ========================================================== */

        async function loadGames() {

            try {

                const contents =
                    await getRepositoryContents();


                /*
                 * PCK dosyaları ve oyun klasörleri
                 * oyun olarak kabul edilir.
                 */

                games =
                    contents.filter(item => {

                        return (
                            item.type === "dir" ||
                            /\.pck$/i.test(item.name)
                        );

                    });


                games.sort(
                    (a, b) =>
                        a.name.localeCompare(
                            b.name,
                            "tr",
                            {
                                sensitivity:
                                    "base"
                            }
                        )
                );


                renderGames(games);


            } catch (error) {

                console.error(error);


                gamesContainer.innerHTML = `
                    <div class="status error">
                        Oyunlar yüklenirken bir hata oluştu.
                        <br><br>
                        Lütfen daha sonra tekrar deneyin.
                    </div>
                `;


                gameCount.textContent =
                    "Hata";


                /*
                 * Açılış ekranının sonsuza kadar kalmaması
                 * için hata durumunda da devam edilir.
                 */
            }
        }


        /* =========================================================
           ARAMA AÇ / KAPAT
        ========================================================== */

        function openSearch() {

            searchOverlay.classList.add("active");

            setTimeout(() => {

                searchInput.focus();

            }, 250);
        }


        function closeSearch() {

            searchOverlay.classList.remove(
                "active"
            );

            searchInput.value = "";

            renderGames(games);
        }


        searchButton.addEventListener(
            "click",
            openSearch
        );


        /*
         * Overlay'in boş kısmına basınca kapat.
         */

        searchOverlay.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    searchOverlay
                ) {

                    closeSearch();
                }

            }
        );


        /*
         * ESC ile kapat.
         */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape" &&
                    searchOverlay.classList.contains(
                        "active"
                    )
                ) {

                    closeSearch();
                }

            }
        );


        /* =========================================================
           ARAMA
        ========================================================== */

        searchInput.addEventListener(
            "input",
            () => {

                const query =
                    searchInput.value
                        .trim()
                        .toLocaleLowerCase(
                            "tr-TR"
                        );


                if (!query) {

                    renderGames(games);

                    return;
                }


                const filtered =
                    games.filter(game => {

                        return cleanGameName(
                            game.name
                        )
                            .toLocaleLowerCase(
                                "tr-TR"
                            )
                            .includes(query);

                    });


                renderGames(filtered);
            }
        );


        /* =========================================================
           BAŞLAT
        ========================================================== */

        startPage();
    </script>

</body>
</html>
