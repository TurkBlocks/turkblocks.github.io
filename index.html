```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TürkBlocks - Geçici Olarak Kullanılamıyor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --main: #500000;
            --main-light: #760000;
            --bg: #070707;
            --card: #111111;
            --text: #ffffff;
            --muted: #a5a5a5;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(80, 0, 0, 0.25),
                    transparent 45%
                ),
                var(--bg);

            color: var(--text);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            overflow-x: hidden;
        }

        /* Arka plan ışıkları */

        body::before,
        body::after {
            content: "";
            position: fixed;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            background: rgba(80, 0, 0, 0.12);

            filter: blur(80px);

            pointer-events: none;

            animation: float 7s ease-in-out infinite alternate;
        }

        body::before {
            top: -100px;
            left: -100px;
        }

        body::after {
            right: -100px;
            bottom: -100px;

            animation-delay: 2s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(35px, 25px);
            }
        }

        .container {
            width: 100%;
            max-width: 850px;

            text-align: center;

            animation: appear 0.8s ease forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Banner */

        .banner-wrapper {
            position: relative;

            width: 100%;

            border-radius: 18px;

            padding: 2px;

            background:
                linear-gradient(
                    135deg,
                    var(--main),
                    transparent 60%
                );

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.55);

            animation: bannerFloat 5s ease-in-out infinite;
        }

        @keyframes bannerFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .banner {
            display: block;

            width: 100%;
            height: 270px;

            object-fit: cover;

            border-radius: 16px;

            background: #151515;
        }

        /* İçerik */

        .content {
            padding: 35px 20px 10px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            padding: 8px 14px;

            border-radius: 999px;

            background: rgba(80, 0, 0, 0.18);

            border: 1px solid rgba(150, 0, 0, 0.25);

            color: #d9d9d9;

            font-size: 13px;

            margin-bottom: 20px;

            animation: fadeUp 0.8s ease 0.15s both;
        }

        .dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #9b0000;

            box-shadow:
                0 0 12px rgba(155, 0, 0, 0.8);

            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.45;
                transform: scale(0.75);
            }
        }

        h1 {
            font-size: clamp(30px, 6vw, 52px);

            line-height: 1.1;

            letter-spacing: -1.5px;

            margin-bottom: 18px;

            animation: fadeUp 0.8s ease 0.25s both;
        }

        .description {
            max-width: 650px;

            margin: 0 auto;

            color: var(--muted);

            font-size: 17px;

            line-height: 1.7;

            animation: fadeUp 0.8s ease 0.35s both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Buton */

        .button {
            position: relative;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-top: 32px;

            padding: 14px 26px;

            border-radius: 10px;

            background: var(--main);

            color: white;

            text-decoration: none;

            font-size: 16px;
            font-weight: 700;

            overflow: hidden;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;

            animation: fadeUp 0.8s ease 0.45s both;
        }

        .button::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.15),
                    transparent
                );

            transform: skewX(-20deg);

            transition: left 0.5s ease;
        }

        .button:hover {
            background: var(--main-light);

            transform: translateY(-3px);

            box-shadow:
                0 12px 35px rgba(80, 0, 0, 0.45);
        }

        .button:hover::before {
            left: 130%;
        }

        .button:active {
            transform: translateY(-1px);
        }

        .arrow {
            transition: transform 0.2s ease;
        }

        .button:hover .arrow {
            transform: translateX(4px);
        }

        footer {
            margin-top: 35px;

            color: #555;

            font-size: 12px;

            animation: fadeUp 0.8s ease 0.55s both;
        }

        /* Mobil */

        @media (max-width: 600px) {

            body {
                padding: 16px;
            }

            .banner {
                height: 180px;
            }

            .banner-wrapper {
                border-radius: 14px;
            }

            .banner {
                border-radius: 12px;
            }

            .content {
                padding-top: 28px;
            }

            .description {
                font-size: 15px;
            }

            .button {
                width: 100%;
            }
        }

        /* Hareket azaltma tercihi */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- =================================
             BANNER RESMİ
             BURAYI DEĞİŞTİR
        ================================== -->

        <div class="banner-wrapper">

            <img
                class="banner"
                src="BANNER_URL"
                alt="TürkBlocks"
            >

        </div>


        <section class="content">

            <!-- Durum etiketi -->

            <div class="status">

                <span class="dot"></span>

                Site geçici olarak kullanılamıyor

            </div>


            <!-- Başlık -->

            <h1>
                Bir şeyler ters gitti.
            </h1>


            <!-- Açıklama -->

            <p class="description">

                TürkBlocks bu sitesi artık kullanılamıyor
              yeni siteye gitmek için butona tıklayın.

            </p>


            <!-- Buton -->

            <a
                class="button"
                href="https://sites.google.com/view/turkblocks"
            >

                Yeni Siteye Git

                <span class="arrow">→</span>

            </a>


            <footer>
                © 2026 TürkBlocks
            </footer>

        </section>

    </main>

</body>
</html>
