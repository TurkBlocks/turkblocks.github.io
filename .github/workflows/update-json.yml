
name: Update games.json

on:
  push:
    paths:
      - "oyunlar/**"
      - ".github/workflows/update-games.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: oyunlar klasörünü tara
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          api_url = (
              "https://api.github.com/repos/"
              "TurkBlocks/turkblocks.github.io/contents/oyunlar"
          )

          request = urllib.request.Request(
              api_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "TurkBlocks-Games-Indexer"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              entries = json.load(response)

          games = []

          def scan(items):
              for item in items:
                  if item.get("type") == "dir":
                      sub_url = item["url"]
                      req = urllib.request.Request(
                          sub_url,
                          headers={
                              "Accept": "application/vnd.github+json",
                              "User-Agent": "TurkBlocks-Games-Indexer"
                          }
                      )
                      with urllib.request.urlopen(req, timeout=30) as res:
                          scan(json.load(res))

                  elif (
                      item.get("type") == "file"
                      and item.get("name", "").lower().endswith(".html")
                  ):
                      path = item["path"]
                      games.append({
                          "name": Path(item["name"]).stem,
                          "path": path
                      })

          scan(entries)
          games.sort(key=lambda game: game["name"].casefold())

          with open("games.json", "w", encoding="utf-8") as f:
              json.dump(games, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"Bulunan HTML oyunu: {len(games)}")
          print(json.dumps(games, ensure_ascii=False, indent=2))
          PY

      - name: JSON doğrula
        run: python3 -m json.tool games.json

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json

          if git diff --cached --quiet; then
            echo "games.json değişmedi."
          else
            git commit -m "Update games.json"
            git push
          fi
