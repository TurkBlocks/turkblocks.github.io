
name: Update games.json

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    paths:
      - ".github/workflows/update-games.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Yayımlanan oyun sayfasını tara
        env:
          GAMES_URL: https://turkblocks.github.io/oyunlar/
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse, unquote
          from pathlib import PurePosixPath

          base_url = os.environ["GAMES_URL"]

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "a":
                      return
                  attrs = dict(attrs)
                  href = attrs.get("href", "")
                  if href:
                      self.links.append(href)

          request = urllib.request.Request(
              base_url,
              headers={"User-Agent": "TurkBlocks-Games-Indexer/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read().decode("utf-8", errors="replace")
              final_url = response.geturl()

          parser = LinkParser()
          parser.feed(html)

          games = []
          seen = set()

          for href in parser.links:
              url = urljoin(final_url, href)
              parsed = urlparse(url)

              if parsed.netloc != urlparse(base_url).netloc:
                  continue

              path = unquote(parsed.path)
              if not path.lower().endswith(".html"):
                  continue

              if not path.startswith("/oyunlar/"):
                  continue

              if path in seen:
                  continue
              seen.add(path)

              filename = PurePosixPath(path).stem
              games.append({
                  "name": filename,
                  "path": path.lstrip("/")
              })

          games.sort(key=lambda game: game["name"].casefold())

          with open("games.json", "w", encoding="utf-8") as f:
              json.dump(games, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"Bulunan HTML bağlantısı: {len(games)}")
          print(json.dumps(games, ensure_ascii=False, indent=2))

          if not games:
              print(
                  "UYARI: Sayfada HTML oyun bağlantısı bulunamadı. "
                  "GitHub Pages klasör listelemesi sunmuyor olabilir."
              )
          PY

      - name: JSON doğrula
        run: python3 -m json.tool games.json

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json

          if git diff --cached --quiet; then
            echo "games.json değişmedi."
          else
            git commit -m "Update games.json"
            git push
          fi
