<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="TürkBlocks Yardım Merkezi"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>Yardım — TürkBlocks</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            min-height: 100vh;

            background: #000000;

            color: #ffffff;

            font-family:
                Inter,
                "Segoe UI",
                system-ui,
                sans-serif;

            line-height: 1.6;
        }


        a {
            color: inherit;

            text-decoration: none;
        }


        .container {
            width: min(
                calc(100% - 32px),
                1000px
            );

            margin: auto;
        }


        /* HEADER */

        header {
            border-bottom: 1px solid #222222;

            padding: 20px 0;
        }


        .header-inner {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }


        .logo {
            display: flex;

            align-items: center;

            gap: 10px;

            font-weight: 900;

            font-size: 18px;
        }


        .logo-box {
            width: 38px;
            height: 38px;

            display: grid;

            place-items: center;

            background: #500000;

            font-size: 11px;

            font-weight: 900;
        }


        .home-link {
            color: #aaaaaa;

            font-size: 13px;

            font-weight: 700;

            transition: color 200ms ease;
        }


        .home-link:hover {
            color: #ffffff;
        }


        /* HERO */

        .hero {
            padding: 110px 0 70px;
        }


        .label {
            display: block;

            margin-bottom: 18px;

            color: #500000;

            font-size: 12px;

            font-weight: 900;

            letter-spacing: 2px;
        }


        h1 {
            max-width: 800px;

            font-size:
                clamp(52px, 9vw, 100px);

            line-height: .95;

            letter-spacing: -5px;

            font-weight: 900;
        }


        h1 span {
            color: #500000;
        }


        .description {
            max-width: 650px;

            margin-top: 30px;

            color: #999999;

            font-size: 17px;

            line-height: 1.8;
        }


        /* FORM */

        .form-section {
            padding: 30px 0 100px;
        }


        .form-box {
            padding: 12px;

            background: #050505;

            border: 1px solid #222222;
        }


        .form-box iframe {
            width: 100%;

            min-height: 750px;

            display: block;

            border: 0;

            background: #ffffff;
        }


        /* FOOTER */

        footer {
            border-top: 1px solid #222222;

            padding: 45px 0;
        }


        .footer-content {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 30px;

            flex-wrap: wrap;
        }


        .mail {
            color: #aaaaaa;

            font-size: 14px;
        }


        .mail a {
            color: #ffffff;

            font-weight: 700;
        }


        .mail a:hover {
            color: #500000;
        }


        .back {
            display: inline-flex;

            padding: 12px 20px;

            background: #500000;

            border: 1px solid #500000;

            color: #ffffff;

            font-size: 13px;

            font-weight: 800;

            transition:
                background-color 200ms ease,
                transform 200ms ease;
        }


        .back:hover {
            background: #3a0000;

            transform: translateY(-2px);
        }


        /* MOBİL */

        @media (max-width: 600px) {

            .hero {
                padding:
                    80px
                    0
                    50px;
            }


            h1 {
                font-size:
                    clamp(48px, 16vw, 75px);

                letter-spacing: -4px;
            }


            .description {
                font-size: 15px;
            }


            .form-section {
                padding-bottom: 70px;
            }


            .form-box {
                padding: 5px;
            }


            .form-box iframe {
                min-height: 700px;
            }


            .footer-content {
                align-items: flex-start;

                flex-direction: column;
            }


            .back {
                width: 100%;

                justify-content: center;
            }

        }


        /* SİSTEM AÇIK TEMA */

        @media (prefers-color-scheme: light) {

            body {
                background: #ffffff;

                color: #000000;
            }


            header,
            footer {
                border-color: #dddddd;
            }


            .home-link,
            .description,
            .mail {
                color: #666666;
            }


            .form-box {
                background: #f5f5f5;

                border-color: #dddddd;
            }


            .home-link:hover,
            .mail a {
                color: #000000;
            }

        }

    </style>
</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="container header-inner">

            <a
                href="../index.html"
                class="logo"
            >

                <span class="logo-box">
                    TB
                </span>

                <span>
                    TürkBlocks
                </span>

            </a>


            <a
                href="../index.html"
                class="home-link"
            >
                Ana Site →
            </a>

        </div>

    </header>


    <!-- HERO -->

    <main>

        <section class="hero">

            <div class="container">

                <span class="label">
                    YARDIM MERKEZİ
                </span>


                <h1>
                    Nasıl
                    <span>yardımcı</span>
                    olabiliriz?
                </h1>


                <p class="description">
                    TürkBlocks hakkında bir sorun,
                    öneri veya geri bildirimin varsa
                    aşağıdaki formu kullanarak
                    bize iletebilirsin.
                </p>

            </div>

        </section>


        <!-- GOOGLE FORM -->

        <section class="form-section">

            <div class="container">

                <div class="form-box">

                    <iframe
                        src="FORM_URL_BURAYA"
                        title="TürkBlocks Yardım Formu"
                        loading="lazy"
                    >
                    </iframe>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="container footer-content">

            <div class="mail">

                Yardım için:

                <a href="mailto:mail@turkblocks.com">
                    mail@turkblocks.com
                </a>

            </div>


            <a
                href="../index.html"
                class="back"
            >
                TürkBlocks Ana Sitesi
            </a>

        </div>

    </footer>


</body>
</html>
