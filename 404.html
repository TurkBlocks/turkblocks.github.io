<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#500000">

    <title>404 | TürkBlocks</title>

    <style>
        :root {
            --background: #070707;
            --red: #500000;
            --red-light: #720000;
            --red-bright: #a00000;
            --text: #ffffff;
            --text-soft: #b7b7b7;
            --border: #242424;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            background: var(--background);
            color: var(--text);

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;
        }

        /* Arka plan */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;
        }

        .glow {
            position: absolute;

            width: 650px;
            height: 650px;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(80, 0, 0, 0.42) 0%,
                    rgba(80, 0, 0, 0.16) 35%,
                    transparent 70%
                );

            filter: blur(15px);

            animation:
                glowMove 7s ease-in-out infinite alternate;
        }

        @keyframes glowMove {
            from {
                transform:
                    translate(-50%, -50%)
                    scale(0.9);
            }

            to {
                transform:
                    translate(-50%, -50%)
                    scale(1.12);
            }
        }

        /* Üst logo */

        .logo {
            position: fixed;

            top: 28px;
            left: 35px;

            z-index: 5;

            color: #ffffff;

            font-size: 23px;
            font-weight: 800;

            letter-spacing: -0.8px;

            text-decoration: none;
        }

        .logo::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: -6px;

            width: 0;
            height: 2px;

            background: var(--red-light);

            transition: width 0.25s ease;
        }

        .logo:hover::after {
            width: 100%;
        }

        /* Ana alan */

        .error-container {
            position: relative;

            z-index: 2;

            min-height: 100vh;

            width: min(
                calc(100% - 40px),
                750px
            );

            margin: auto;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            animation:
                enter 0.8s ease both;
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 404 */

        .error-code {
            font-size:
                clamp(110px, 24vw, 220px);

            line-height: 0.8;

            font-weight: 900;

            letter-spacing: -12px;

            color: var(--red);

            text-shadow:
                0 0 70px
                rgba(100, 0, 0, 0.35);

            animation:
                errorPulse 4s ease-in-out infinite;
        }

        @keyframes errorPulse {
            0%,
            100% {
                text-shadow:
                    0 0 50px
                    rgba(100, 0, 0, 0.25);
            }

            50% {
                text-shadow:
                    0 0 90px
                    rgba(150, 0, 0, 0.45);
            }
        }

        .line {
            width: 70px;
            height: 3px;

            margin: 38px 0 25px;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    var(--red),
                    var(--red-bright)
                );
        }

        h1 {
            font-size:
                clamp(30px, 6vw, 48px);

            line-height: 1.1;

            letter-spacing: -1.5px;
        }

        .description {
            max-width: 560px;

            margin-top: 18px;

            color: var(--text-soft);

            font-size: 16px;

            line-height: 1.7;
        }

        /* Butonlar */

        .buttons {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 13px;

            margin-top: 34px;
        }

        .button {
            min-width: 175px;
            min-height: 50px;

            padding: 0 24px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            border-radius: 9px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .primary {
            background: var(--red);

            border: 1px solid var(--red);

            color: #ffffff;
        }

        .primary:hover {
            background: var(--red-light);

            transform: translateY(-3px);

            box-shadow:
                0 15px 40px
                rgba(80, 0, 0, 0.4);
        }

        .secondary {
            background: rgba(255, 255, 255, 0.02);

            border: 1px solid var(--border);

            color: #ffffff;
        }

        .secondary:hover {
            background:
                rgba(255, 255, 255, 0.06);

            border-color: #444444;

            transform: translateY(-3px);
        }

        /* Alt yazı */

        .footer {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 25px;

            z-index: 3;

            text-align: center;

            color: #555555;

            font-size: 12px;
        }

        /* Mobil */

        @media (max-width: 600px) {

            body {
                overflow: hidden;
            }

            .logo {
                top: 22px;
                left: 20px;

                font-size: 20px;
            }

            .error-container {
                width:
                    calc(100% - 28px);
            }

            .error-code {
                letter-spacing: -7px;
            }

            .description {
                font-size: 15px;
            }

            .buttons {
                width: 100%;

                flex-direction: column;
            }

            .button {
                width: 100%;
            }

            .footer {
                bottom: 18px;
            }
        }

        /* Hareket azaltma */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="glow"></div>
    </div>


    <a href="/" class="logo">
        TürkBlocks
    </a>


    <main class="error-container">

        <div class="error-code">
            404
        </div>

        <div class="line"></div>

        <h1>
            Sayfa bulunamadı
        </h1>

        <p class="description">
            Aradığın sayfa mevcut değil, taşınmış veya kaldırılmış olabilir.
        </p>

        <div class="buttons">

            <a href="/" class="button primary">
                Ana Sayfaya Dön
            </a>

            <button
                class="button secondary"
                id="backButton"
                type="button">
                Geri Dön
            </button>

        </div>

    </main>


    <footer class="footer">
        TürkBlocks
    </footer>


    <script>
        // Geri dön butonu

        const backButton =
            document.getElementById("backButton");

        backButton.addEventListener("click", () => {

            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "/";
            }

        });
    </script>

</body>
</html>
