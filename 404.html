<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>404 — TürkBlocks</title>

    <style>

        /* ==================================================
           VARIABLES
           ================================================== */

        :root {
            --black: #000000;
            --red: #500000;
            --red-dark: #380000;

            --white: #ffffff;
            --text: #eeeeee;
            --muted: #999999;

            --border: #242424;
        }


        /* ==================================================
           RESET
           ================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            min-height: 100%;
        }


        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            background: var(--black);
            color: var(--text);

            font-family:
                Inter,
                "Segoe UI",
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;

            overflow-x: hidden;
        }


        /* ==================================================
           MAIN
           ================================================== */

        .page {
            width: min(100%, 1100px);

            padding: 70px 0;

            position: relative;
        }


        /* ==================================================
           TOP LINE
           ================================================== */

        .top-line {
            width: 70px;
            height: 5px;

            margin-bottom: 35px;

            background: var(--red);
        }


        /* ==================================================
           BRAND
           ================================================== */

        .brand {
            display: inline-flex;
            align-items: center;

            gap: 10px;

            margin-bottom: 65px;

            color: var(--white);

            font-size: 18px;
            font-weight: 800;

            text-decoration: none;
        }


        .brand-box {
            width: 36px;
            height: 36px;

            display: grid;
            place-items: center;

            background: var(--red);

            color: var(--white);

            font-size: 11px;
            font-weight: 900;
        }


        /* ==================================================
           404
           ================================================== */

        .code {
            display: block;

            color: var(--red);

            font-size: clamp(
                110px,
                22vw,
                260px
            );

            font-weight: 950;

            line-height: 0.8;

            letter-spacing: -12px;

            text-decoration: none;

            user-select: none;

            transition:
                color 240ms ease;
        }


        .code:hover {
            color: var(--red-dark);
        }


        /* ==================================================
           TEXT
           ================================================== */

        h1 {
            margin-top: 45px;

            color: var(--white);

            font-size: clamp(
                32px,
                5vw,
                58px
            );

            font-weight: 850;

            line-height: 1;

            letter-spacing: -2px;
        }


        p {
            max-width: 600px;

            margin-top: 20px;

            color: var(--muted);

            font-size: 17px;

            line-height: 1.8;
        }


        /* ==================================================
           BUTTONS
           ================================================== */

        .actions {
            display: flex;
            flex-wrap: wrap;

            gap: 12px;

            margin-top: 35px;
        }


        .button {
            min-height: 48px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 12px 22px;

            border-radius: 3px;

            font-size: 14px;
            font-weight: 700;

            text-decoration: none;

            transition:
                background-color 220ms ease,
                border-color 220ms ease,
                color 220ms ease;
        }


        /* PRIMARY */

        .button-primary {
            background: var(--red);

            border: 1px solid var(--red);

            color: var(--white);
        }


        .button-primary:hover {
            background: var(--red-dark);

            border-color: var(--red-dark);
        }


        /* SECONDARY */

        .button-secondary {
            background: transparent;

            border: 1px solid var(--border);

            color: var(--white);
        }


        .button-secondary:hover {
            background: #080808;

            border-color: #444444;
        }


        /* ==================================================
           FOOTER
           ================================================== */

        .footer {
            margin-top: 80px;

            padding-top: 20px;

            border-top: 1px solid var(--border);

            color: #666666;

            font-size: 12px;
        }


        /* ==================================================
           AUTOMATIC LIGHT THEME
           ================================================== */

        @media (prefers-color-scheme: light) {

            :root {
                --black: #ffffff;

                --white: #000000;

                --text: #111111;

                --muted: #666666;

                --border: #d5d5d5;
            }


            .button-secondary:hover {
                background: #f3f3f3;

                border-color: #aaaaaa;
            }

        }


        /* ==================================================
           MOBILE
           ================================================== */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }


            .page {
                padding: 45px 0;
            }


            .brand {
                margin-bottom: 50px;
            }


            .code {
                font-size: 110px;

                letter-spacing: -7px;
            }


            h1 {
                margin-top: 35px;

                font-size: 36px;
            }


            p {
                font-size: 15px;
            }


            .actions {
                flex-direction: column;

                align-items: stretch;
            }


            .button {
                width: 100%;
            }


            .footer {
                margin-top: 60px;
            }

        }


        /* ==================================================
           SMALL PHONES
           ================================================== */

        @media (max-width: 380px) {

            .code {
                font-size: 95px;
            }


            h1 {
                font-size: 32px;
            }

        }


        /* ==================================================
           REDUCED MOTION
           ================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before {
                transition: none !important;
            }

        }

    </style>
</head>


<body>

    <main class="page">


        <!-- TOP LINE -->

        <div class="top-line"></div>


        <!-- BRAND -->

        <a
            href="./index.html"
            class="brand"
            aria-label="TürkBlocks ana sayfa"
        >

            <span class="brand-box">
                TB
            </span>

            TürkBlocks

        </a>


        <!-- 404 -->

        <a
            href="./index.html"
            class="code"
            aria-label="Ana sayfaya dön"
        >
            404
        </a>


        <!-- MESSAGE -->

        <h1>
            Aradığın sayfa bulunamadı.
        </h1>


        <p>
            Bu sayfa taşınmış, silinmiş veya hiç
            oluşturulmamış olabilir. Adresi kontrol
            edebilir ya da TürkBlocks ana sayfasına
            geri dönebilirsin.
        </p>


        <!-- LINK BUTTONS -->

        <div class="actions">

            <a
                href="./"
                class="button button-primary"
            >
                Ana Sayfaya Dön
            </a>


            <a
                href="mailto:salih-turkblocks@outlook.com.tr"
                class="button button-secondary"
            >
                Böyle Bir Sayfamı Var? Bildirin
            </a>

        </div>


        <!-- FOOTER -->

        <footer class="footer">
            © 2026 TürkBlocks
        </footer>


    </main>

</body>
</html>
