<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#500000"
    >

    <title>404 — TürkBlocks</title>

    <!-- Google Sans -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --accent: #500000;
            --accent-hover: #680000;

            --background: #f5f5f5;
            --surface: #ffffff;

            --text: #111111;
            --muted: #6b6b6b;

            --border: #e5e5e5;

            --shadow:
                0 15px 45px rgba(0, 0, 0, 0.07);
        }


        /* Koyu tema */

        @media (prefers-color-scheme: dark) {

            :root {
                --background: #0d0d0d;
                --surface: #151515;

                --text: #f3f3f3;
                --muted: #a1a1a1;

                --border: #292929;

                --shadow:
                    0 15px 45px rgba(0, 0, 0, 0.35);
            }

        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {
            margin: 0;

            background: var(--background);
            color: var(--text);

            font-family:
                "Google Sans",
                "Segoe UI",
                Arial,
                sans-serif;

            display: flex;
            flex-direction: column;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }


        /* Üst bar */

        header {
            width: 100%;

            border-bottom:
                1px solid var(--border);

            background:
                var(--surface);
        }


        .navbar {
            width: min(1180px, 100%);

            min-height: 72px;

            margin: auto;
            padding: 0 24px;

            display: flex;
            align-items: center;
        }


        .brand {
            display: flex;
            align-items: center;

            gap: 11px;

            color: var(--text);

            text-decoration: none;

            font-size: 18px;
            font-weight: 700;

            letter-spacing: 0.4px;
        }


        .brand img {
            width: 39px;
            height: 39px;

            object-fit: contain;

            border-radius: 10px;
        }


        /* Ana içerik */

        main {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px 20px;
        }


        .error-card {
            width: min(650px, 100%);

            padding: 55px 40px;

            text-align: center;

            background: var(--surface);

            border:
                1px solid var(--border);

            border-radius: 22px;

            box-shadow: var(--shadow);
        }


        .error-code {
            margin: 0 0 8px;

            color: var(--accent);

            font-size:
                clamp(70px, 14vw, 130px);

            line-height: 0.9;

            font-weight: 700;

            letter-spacing: -6px;
        }


        h1 {
            margin: 25px 0 12px;

            font-size: 28px;

            letter-spacing: -0.7px;
        }


        .description {
            max-width: 470px;

            margin: 0 auto 28px;

            color: var(--muted);

            font-size: 15px;

            line-height: 1.7;
        }


        /* Ana sayfa butonu */

        .home-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 11px 18px;

            border-radius: 10px;

            background: var(--accent);

            color: #ffffff;

            font-size: 14px;
            font-weight: 600;

            text-decoration: none;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .home-button:hover {
            background: var(--accent-hover);

            transform: translateY(-2px);
        }


        /* Footer */

        footer {
            padding: 24px;

            text-align: center;

            color: var(--muted);

            font-size: 12px;

            border-top:
                1px solid var(--border);
        }


        /* Mobil */

        @media (max-width: 600px) {

            .navbar {
                padding: 0 18px;
            }


            .error-card {
                padding:
                    45px 24px;

                border-radius: 18px;
            }


            .error-code {
                font-size: 90px;
            }


            h1 {
                font-size: 24px;
            }

        }


        ::selection {
            background: var(--accent);
            color: #ffffff;
        }

    </style>
</head>


<body>


    <!-- ÜST BAR -->

    <header>

        <nav class="navbar">

            <a
                href="/"
                class="brand"
            >

                <img
                    src="https://turkblocks.github.io/turkblockslogo6.png"
                    alt="TürkBlocks"
                >

                <span>
                    TÜRKBLOCKS
                </span>

            </a>

        </nav>

    </header>


    <!-- HATA SAYFASI -->

    <main>

        <section class="error-card">

            <p class="error-code">
                404
            </p>


            <h1>
                Sayfa bulunamadı
            </h1>


            <p class="description">
                Aradığın sayfa taşınmış, silinmiş
                veya hiç oluşturulmamış olabilir.
            </p>


            <a
                href="/"
                class="home-button"
            >
                Ana Sayfaya Git
            </a>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        © 2026 TürkBlocks
    </footer>


</body>
</html>
