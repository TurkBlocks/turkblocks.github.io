<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - TÜRKBLOCKS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            color-scheme: light dark;

            --bg: #000000;
            --surface: #111111;
            --text: #ffffff;
            --muted: #a5a5a5;
            --border: #292929;
            --accent: #500000;
            --accent-hover: #680000;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f7f7f7;
                --surface: #ffffff;
                --text: #111111;
                --muted: #666666;
                --border: #dddddd;
                --accent: #500000;
                --accent-hover: #680000;
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            flex-direction: column;

            background: var(--bg);
            color: var(--text);

            font-family:
                "Google Sans",
                Arial,
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        header {
            width: 100%;

            display: flex;
            align-items: center;

            padding: 18px 28px;

            border-bottom: 1px solid var(--border);

            background: color-mix(
                in srgb,
                var(--bg) 88%,
                transparent
            );

            backdrop-filter: blur(18px);
        }

        .brand {
            display: inline-flex;
            align-items: center;

            gap: 11px;

            font-size: 21px;
            font-weight: 700;

            letter-spacing: 1px;
        }

        .brand img {
            width: 35px;
            height: 35px;

            object-fit: contain;
        }

        /*
         * TÜRKBLOCKS RGB efekti
         * Soldan sağa akar.
         */

        .brand-text {
            position: relative;

            color: var(--text);

            transition: color .25s ease;
        }

        .brand-text::after {
            content: "TÜRKBLOCKS";

            position: absolute;
            inset: 0;

            color: transparent;

            background:
                linear-gradient(
                    90deg,
                    #ff0000,
                    #ff7a00,
                    #ffff00,
                    #00ff55,
                    #00c8ff,
                    #3d5cff,
                    #b400ff,
                    #ff008c,
                    #ff0000
                );

            background-size: 300% 100%;

            background-clip: text;
            -webkit-background-clip: text;

            opacity: 0;

            pointer-events: none;
        }

        .brand:hover .brand-text {
            color: transparent;
        }

        .brand:hover .brand-text::after {
            opacity: 1;

            animation:
                rgbLeftToRight
                2.5s
                linear
                infinite;
        }

        @keyframes rgbLeftToRight {
            from {
                background-position: 0% 50%;
            }

            to {
                background-position: 300% 50%;
            }
        }

        /* =====================================================
           404 ALANI
        ===================================================== */

        main {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 60px 20px;
        }

        .error {
            width: min(650px, 100%);

            text-align: center;
        }

        .error-code {
            margin: 0;

            font-size: clamp(
                110px,
                22vw,
                210px
            );

            line-height: .85;

            font-weight: 700;

            letter-spacing: -10px;

            color: var(--text);

            text-shadow:
                0 0 0 transparent;

            animation:
                errorGlow 4s ease-in-out infinite;
        }

        @keyframes errorGlow {
            0%,
            100% {
                text-shadow:
                    0 0 0 transparent;
            }

            50% {
                text-shadow:
                    0 0 35px
                    rgba(80, 0, 0, .55);
            }
        }

        .error h1 {
            margin: 35px 0 12px;

            font-size: clamp(
                25px,
                5vw,
                38px
            );

            letter-spacing: -1px;
        }

        .error p {
            margin: 0 auto;

            max-width: 500px;

            color: var(--muted);

            font-size: 16px;

            line-height: 1.6;
        }

        /* =====================================================
           BUTON
        ===================================================== */

        .home-button {
            display: inline-block;

            margin-top: 30px;

            padding: 12px 22px;

            border: 1px solid var(--accent);

            border-radius: 12px;

            background: var(--accent);

            color: #ffffff;

            font-size: 15px;
            font-weight: 500;

            transition:
                background .2s ease,
                transform .2s ease,
                border-color .2s ease;
        }

        .home-button:hover {
            background: var(--accent-hover);

            border-color:
                var(--accent-hover);

            transform: translateY(-2px);
        }

        .home-button:active {
            transform: scale(.97);
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            padding: 22px;

            border-top: 1px solid var(--border);

            color: var(--muted);

            text-align: center;

            font-size: 13px;
        }

        /* =====================================================
           MOBİL
        ===================================================== */

        @media (max-width: 600px) {

            header {
                padding: 14px 17px;
            }

            .brand {
                font-size: 18px;
            }

            .brand img {
                width: 31px;
                height: 31px;
            }

            .error-code {
                letter-spacing: -5px;
            }
        }

        /* =====================================================
           HAREKET AZALTMA
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <a
            class="brand"
            href="/"
            aria-label="TürkBlocks ana sayfa"
        >

            <img
                src="https://turkblocks.gamer.gd/logo/6642781985798787256865186887954381688697668781534687987679868154396796545368967453.png"
                alt="TürkBlocks"
            >

            <span class="brand-text">
                TÜRKBLOCKS
            </span>

        </a>

    </header>


    <!-- 404 -->

    <main>

        <section
            class="error"
            aria-labelledby="error-title"
        >

            <div class="error-code">
                404
            </div>

            <h1 id="error-title">
                Sayfa bulunamadı
            </h1>

            <p>
                Aradığın sayfa mevcut değil,
                taşınmış veya kaldırılmış olabilir.
            </p>

            <a
                class="home-button"
                href="/"
            >
                Ana Sayfaya Dön
            </a>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>
        © TürkBlocks
    </footer>

</body>
</html>
