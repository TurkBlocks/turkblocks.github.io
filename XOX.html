<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XOX - Neon Tic-Tac-Toe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            min-height: 100vh;
        }

        /* Glassmorphism Efekti */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Neon Parlamaları */
        .text-neon-x {
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6), 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .text-neon-o {
            color: #f43f5e;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.6), 0 0 20px rgba(244, 63, 94, 0.4);
        }

        .cell-x {
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
        }

        .cell-o {
            color: #f43f5e;
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.8);
        }

        /* Hücre Etkileşimi */
        .cell-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cell-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.03);
        }

        .cell-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        /* Kazanan Çizgisi */
        .winning-line {
            position: absolute;
            background: linear-gradient(90deg, #38bdf8, #f43f5e);
            border-radius: 999px;
            z-index: 10;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            transition: all 0.4s ease-in-out;
            pointer-events: none;
        }

        /* Özel Animasyonlar */
        @keyframes popIn {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pulseActive {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
        }

        .active-turn {
            animation: pulseActive 1.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen text-slate-100 select-none">

    <div class="w-full max-w-md flex flex-col items-center gap-5">
        
        <!-- Üst Başlık & Ses Kontrolü -->
        <div class="w-full flex items-center justify-between px-2">
            <div>
                <h1 class="text-3xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-sky-400 via-indigo-300 to-rose-400">
                    XOX NEON
                </h1>
                <p class="text-xs text-slate-400 font-medium">Stratejini Seç ve Kazan</p>
            </div>
            
            <button id="soundToggle" class="glass-panel p-3 rounded-2xl hover:bg-slate-700/50 transition-colors flex items-center justify-center text-slate-300" title="Sesi Aç/Kapat">
                <!-- Ses Açık İkonu (Varsayılan) -->
                <svg id="soundOnIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                </svg>
                <!-- Ses Kapalı İkonu -->
                <svg id="soundOffIcon" class="w-6 h-6 hidden text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
                </svg>
            </button>
        </div>

        <!-- Mod & Zorluk Seçimi -->
        <div class="w-full glass-panel p-2 rounded-2xl flex flex-col gap-2">
            <div class="grid grid-cols-2 gap-1 bg-slate-900/60 p-1 rounded-xl">
                <button id="modeSingle" class="py-2 text-xs font-semibold rounded-lg transition-all bg-sky-500/20 text-sky-300 border border-sky-500/30">
                    🤖 Tek Oyunculu
                </button>
                <button id="modeDual" class="py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-slate-200">
                    👥 İki Oyunculu
                </button>
            </div>

            <!-- Zorluk Seviyesi (Tek Oyunculu İçin) -->
            <div id="difficultyContainer" class="flex items-center justify-between px-2 pt-1">
                <span class="text-xs text-slate-400 font-medium">Yapay Zeka Zorluğu:</span>
                <div class="flex gap-1">
                    <button class="diff-btn px-2.5 py-1 text-xs rounded-lg font-medium text-slate-400 hover:bg-slate-800 transition-colors" data-diff="easy">Kolay</button>
                    <button class="diff-btn px-2.5 py-1 text-xs rounded-lg font-medium text-slate-400 hover:bg-slate-800 transition-colors" data-diff="medium">Orta</button>
                    <button class="diff-btn px-2.5 py-1 text-xs rounded-lg font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30" data-diff="hard">İmkansız</button>
                </div>
            </div>
        </div>

        <!-- Skor Tablosu -->
        <div class="w-full grid grid-cols-3 gap-3">
            <div id="cardX" class="glass-panel p-3 rounded-2xl flex flex-col items-center justify-center border-l-4 border-sky-400 transition-all">
                <span class="text-xs font-semibold text-slate-400 mb-1" id="labelX">X (Oyuncu)</span>
                <span id="scoreX" class="text-2xl font-black text-neon-x">0</span>
            </div>
            <div id="cardDraw" class="glass-panel p-3 rounded-2xl flex flex-col items-center justify-center border-l-4 border-slate-500 transition-all">
                <span class="text-xs font-semibold text-slate-400 mb-1">Berabere</span>
                <span id="scoreDraw" class="text-2xl font-black text-slate-300">0</span>
            </div>
            <div id="cardO" class="glass-panel p-3 rounded-2xl flex flex-col items-center justify-center border-l-4 border-rose-400 transition-all">
                <span class="text-xs font-semibold text-slate-400 mb-1" id="labelO">O (Yapay Zeka)</span>
                <span id="scoreO" class="text-2xl font-black text-neon-o">0</span>
            </div>
        </div>

        <!-- Oyun Durumu / Sıra Göstergesi -->
        <div id="statusDisplay" class="glass-panel px-6 py-2.5 rounded-full text-sm font-semibold text-slate-200 tracking-wide active-turn border border-slate-700/50 shadow-lg">
            Sıra: <span class="text-neon-x font-bold">X</span> oyuncusunda
        </div>

        <!-- Oyun Tahtası -->
        <div class="relative w-full aspect-square max-w-[360px] glass-panel p-3 rounded-3xl shadow-2xl flex items-center justify-center">
            
            <div id="board" class="w-full h-full grid grid-cols-3 gap-3 relative">
                <!-- 9 Adet Hücre -->
                <button class="cell-btn glass-panel rounded-2xl text-4xl sm:text-5xl font-black flex items-center justify-center" data-index="0"></button>
                <button class="cell-btn glass-panel rounded-2xl text-4xl sm:text-5xl font-black flex items-center justify-center" data-index="1"></button>
                <button class="cell-btn glass-panel rounded-2xl text-4xl sm:text-5xl font-black flex items-center justify-center" data-index="2"></button>
                <button class="cell-btn glass-panel rounded-2xl text-4xl sm:text-5xl font-black flex items-center justify-center" data-index="3"></button>
                <button class="cell-btn glass-panel rounded-2xl text-4xl sm:text-5xl font-black flex items-center justify-center" data-index="4"></button>
                <button class="cell-btn glass-panel rounded-2xl text-4xl sm:text-5xl font-black flex items-center justify-center" data-index="5"></button>
                <button class="cell-btn glass-panel rounded-2xl text-4xl sm:text-5xl font-black flex items-center justify-center" data-index="6"></button>
                <button class="cell-btn glass-panel rounded-2xl text-4xl sm:text-5xl font-black flex items-center justify-center" data-index="7"></button>
                <button class="cell-btn glass-panel rounded-2xl text-4xl sm:text-5xl font-black flex items-center justify-center" data-index="8"></button>

                <!-- Dinamik Kazanan Çizgisi -->
                <div id="winningLine" class="winning-line hidden"></div>
            </div>
        </div>

        <!-- Kontrol Butonları -->
        <div class="w-full flex gap-3 pt-1">
            <button id="resetGameBtn" class="flex-1 glass-panel py-3 rounded-2xl font-semibold text-sm hover:bg-slate-700/40 transition-all flex items-center justify-center gap-2 border border-slate-700">
                <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Yeniden Başlat
            </button>
            <button id="resetScoreBtn" class="glass-panel px-4 py-3 rounded-2xl font-semibold text-xs text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 transition-all border border-slate-700/50" title="Skorları Sıfırla">
                Skorları Sıfırla
            </button>
        </div>

    </div>

    <!-- Oyun Mantığı & Ses Sistemi -->
    <script>
        // Web Audio API Sentezleyicisi
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playTone(freq, type, duration, startVol = 0.1, endVol = 0.001) {
                if (!this.enabled) return;
                this.init();
                
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    
                    gain.gain.setValueAtTime(startVol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(endVol, this.ctx.currentTime + duration);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {
                    console.error("Ses oynatılamadı", e);
                }
            }

            playX() {
                this.playTone(440, 'sine', 0.1, 0.15); // A4
            }

            playO() {
                this.playTone(330, 'sine', 0.12, 0.15); // E4
            }

            playWin() {
                if (!this.enabled) return;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        this.playTone(freq, 'triangle', 0.25, 0.2);
                    }, idx * 90);
                });
            }

            playDraw() {
                if (!this.enabled) return;
                const notes = [300, 270, 240];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        this.playTone(freq, 'sawtooth', 0.2, 0.08);
                    }, idx * 100);
                });
            }

            playClick() {
                this.playTone(800, 'sine', 0.05, 0.05);
            }
        }

        // Oyun Durum Değişkenleri
        let boardState = Array(9).fill("");
        let currentPlayer = "X";
        let isGameActive = true;
        let gameMode = "single"; // "single" veya "dual"
        let aiDifficulty = "hard"; // "easy", "medium", "hard"
        let scores = { X: 0, O: 0, draw: 0 };

        const sound = new SoundEffects();

        // Kazanma Kombinasyonları
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Yatay
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Dikey
            [0, 4, 8], [2, 4, 6]             // Çapraz
        ];

        // DOM Elemanları
        const cells = document.querySelectorAll(".cell-btn");
        const statusDisplay = document.getElementById("statusDisplay");
        const winningLine = document.getElementById("winningLine");
        const resetGameBtn = document.getElementById("resetGameBtn");
        const resetScoreBtn = document.getElementById("resetScoreBtn");
        
        const modeSingleBtn = document.getElementById("modeSingle");
        const modeDualBtn = document.getElementById("modeDual");
        const diffContainer = document.getElementById("difficultyContainer");
        const diffBtns = document.querySelectorAll(".diff-btn");

        const scoreXEl = document.getElementById("scoreX");
        const scoreOEl = document.getElementById("scoreO");
        const scoreDrawEl = document.getElementById("scoreDraw");
        const labelXEl = document.getElementById("labelX");
        const labelOEl = document.getElementById("labelO");

        const soundToggleBtn = document.getElementById("soundToggle");
        const soundOnIcon = document.getElementById("soundOnIcon");
        const soundOffIcon = document.getElementById("soundOffIcon");

        // Başlatma
        initGame();

        function initGame() {
            cells.forEach(cell => cell.addEventListener("click", handleCellClick));
            resetGameBtn.addEventListener("click", () => { sound.playClick(); resetGame(); });
            resetScoreBtn.addEventListener("click", () => { sound.playClick(); resetScores(); });
            
            modeSingleBtn.addEventListener("click", () => switchMode("single"));
            modeDualBtn.addEventListener("click", () => switchMode("dual"));

            diffBtns.forEach(btn => {
                btn.addEventListener("click", (e) => {
                    sound.playClick();
                    diffBtns.forEach(b => {
                        b.className = "diff-btn px-2.5 py-1 text-xs rounded-lg font-medium text-slate-400 hover:bg-slate-800 transition-colors";
                    });
                    e.target.className = "diff-btn px-2.5 py-1 text-xs rounded-lg font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30";
                    aiDifficulty = e.target.getAttribute("data-diff");
                    resetGame();
                });
            });

            soundToggleBtn.addEventListener("click", toggleSound);
        }

        function toggleSound() {
            sound.enabled = !sound.enabled;
            if (sound.enabled) {
                soundOnIcon.classList.remove("hidden");
                soundOffIcon.classList.add("hidden");
                sound.playClick();
            } else {
                soundOnIcon.classList.add("hidden");
                soundOffIcon.classList.remove("hidden");
            }
        }

        function switchMode(mode) {
            sound.playClick();
            gameMode = mode;
            if (mode === "single") {
                modeSingleBtn.className = "py-2 text-xs font-semibold rounded-lg transition-all bg-sky-500/20 text-sky-300 border border-sky-500/30";
                modeDualBtn.className = "py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-slate-200";
                diffContainer.classList.remove("hidden");
                labelXEl.textContent = "X (Oyuncu)";
                labelOEl.textContent = "O (Yapay Zeka)";
            } else {
                modeDualBtn.className = "py-2 text-xs font-semibold rounded-lg transition-all bg-sky-500/20 text-sky-300 border border-sky-500/30";
                modeSingleBtn.className = "py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-slate-200";
                diffContainer.classList.add("hidden");
                labelXEl.textContent = "X Oyuncusu";
                labelOEl.textContent = "O Oyuncusu";
            }
            resetScores();
            resetGame();
        }

        function handleCellClick(e) {
            const clickedIndex = parseInt(e.target.getAttribute("data-index"));

            if (boardState[clickedIndex] !== "" || !isGameActive) return;

            makeMove(clickedIndex, currentPlayer);

            if (isGameActive && gameMode === "single" && currentPlayer === "O") {
                // Yapay Zeka Hamlesi
                isGameActive = false; // Yapay Zeka oynarken tıklamayı engelle
                setTimeout(() => {
                    makeAiMove();
                }, 400);
            }
        }

        function makeMove(index, player) {
            boardState[index] = player;
            const cell = cells[index];
            cell.textContent = player;
            cell.classList.add(player === "X" ? "cell-x" : "cell-o", "animate-pop");

            if (player === "X") sound.playX();
            else sound.playO();

            checkResult();
        }

        function checkResult() {
            let roundWon = false;
            let winningCombo = null;

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    roundWon = true;
                    winningCombo = winningConditions[i];
                    break;
                }
            }

            if (roundWon) {
                isGameActive = false;
                drawWinningLine(winningCombo);
                scores[currentPlayer]++;
                updateScoreboard();
                
                statusDisplay.innerHTML = `<span class="${currentPlayer === 'X' ? 'text-neon-x' : 'text-neon-o'} font-bold">${currentPlayer}</span> Kazandı! 🎉`;
                statusDisplay.classList.remove("active-turn");

                sound.playWin();
                triggerConfetti();
                return;
            }

            // Beraberlik Kontrolü
            if (!boardState.includes("")) {
                isGameActive = false;
                scores.draw++;
                updateScoreboard();
                statusDisplay.innerHTML = `<span class="text-slate-300 font-bold">Berabere!</span> 🤝`;
                statusDisplay.classList.remove("active-turn");
                sound.playDraw();
                return;
            }

            // Sıra Değiştir
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            updateStatusDisplay();
            if (gameMode === "single" && currentPlayer === "O") {
                // Yapay zeka sırası
            } else {
                isGameActive = true;
            }
        }

        function updateStatusDisplay() {
            const playerText = currentPlayer === "X" ? 
                `<span class="text-neon-x font-bold">X</span>` : 
                `<span class="text-neon-o font-bold">O</span>`;
            
            if (gameMode === "single") {
                statusDisplay.innerHTML = currentPlayer === "X" ? 
                    `Sıra Sende (${playerText})` : 
                    `Yapay Zeka Düşünüyor...`;
            } else {
                statusDisplay.innerHTML = `Sıra: ${playerText} oyuncusunda`;
            }
        }

        function updateScoreboard() {
            scoreXEl.textContent = scores.X;
            scoreOEl.textContent = scores.O;
            scoreDrawEl.textContent = scores.draw;
        }

        function resetGame() {
            boardState = Array(9).fill("");
            currentPlayer = "X";
            isGameActive = true;
            
            winningLine.classList.add("hidden");
            statusDisplay.classList.add("active-turn");
            updateStatusDisplay();

            cells.forEach(cell => {
                cell.textContent = "";
                cell.className = "cell-btn glass-panel rounded-2xl text-4xl sm:text-5xl font-black flex items-center justify-center";
            });
        }

        function resetScores() {
            scores = { X: 0, O: 0, draw: 0 };
            updateScoreboard();
        }

        // Kazanan Çizgisini Çiz
        function drawWinningLine(combo) {
            const board = document.getElementById("board");
            const boardRect = board.getBoundingClientRect();
            
            const cellA = cells[combo[0]].getBoundingClientRect();
            const cellC = cells[combo[2]].getBoundingClientRect();

            const x1 = cellA.left + cellA.width / 2 - boardRect.left;
            const y1 = cellA.top + cellA.height / 2 - boardRect.top;
            const x2 = cellC.left + cellC.width / 2 - boardRect.left;
            const y2 = cellC.top + cellC.height / 2 - boardRect.top;

            const distance = Math.hypot(x2 - x1, y2 - y1);
            const angle = Math.atan2(y2 - y1, x2 - x1) * (180 / Math.PI);

            winningLine.style.width = `${distance}px`;
            winningLine.style.height = `6px`;
            winningLine.style.left = `${x1}px`;
            winningLine.style.top = `${y1 - 3}px`;
            winningLine.style.transformOrigin = `0 50%`;
            winningLine.style.transform = `rotate(${angle}deg)`;

            winningLine.classList.remove("hidden");
        }

        // Konfeti Efekti
        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#38bdf8', '#f43f5e', '#a855f7']
                });
            }
        }

        // YAPAY ZEKA MANTIĞI
        function makeAiMove() {
            let move;
            if (aiDifficulty === "easy") {
                move = getRandomMove();
            } else if (aiDifficulty === "medium") {
                // %50 en iyi hamle, %50 rastgele
                move = Math.random() < 0.5 ? getBestMove() : getRandomMove();
            } else {
                // İmkansız / Minimax
                move = getBestMove();
            }

            if (move !== undefined && move !== null) {
                makeMove(move, "O");
            }
        }

        function getRandomMove() {
            const emptyIndices = boardState
                .map((val, idx) => val === "" ? idx : null)
                .filter(val => val !== null);
            
            if (emptyIndices.length === 0) return null;
            return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        }

        function getBestMove() {
            let bestScore = -Infinity;
            let move;

            for (let i = 0; i < 9; i++) {
                if (boardState[i] === "") {
                    boardState[i] = "O";
                    let score = minimax(boardState, 0, false);
                    boardState[i] = "";
                    if (score > bestScore) {
                        bestScore = score;
                        move = i;
                    }
                }
            }
            return move;
        }

        const scoresMap = {
            O: 10,
            X: -10,
            draw: 0
        };

        function minimax(board, depth, isMaximizing) {
            let result = checkWinnerForMinimax();
            if (result !== null) {
                return scoresMap[result];
            }

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === "") {
                        board[i] = "O";
                        let score = minimax(board, depth + 1, false);
                        board[i] = "";
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === "") {
                        board[i] = "X";
                        let score = minimax(board, depth + 1, true);
                        board[i] = "";
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        function checkWinnerForMinimax() {
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    return boardState[a];
                }
            }

            if (!boardState.includes("")) {
                return "draw";
            }

            return null;
        }
    </script>
