<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yılan Oyunu</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --surface-2: #141414;
            --border: #222222;
            --text: #f8f9fa;
            --text-secondary: #9ca3af;
            --primary: #500000;
            --primary-hover: #780000;
            --snake-green: #22c55e;
            --apple-red: #ef4444;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Google Sans", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 16px;
            background: var(--surface-2);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .score-item {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .score-item span {
            display: block;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            margin-top: 2px;
        }

        canvas {
            background: #050505;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: block;
            margin: 0 auto 16px auto;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
            max-width: 220px;
            margin-left: auto;
            margin-right: auto;
        }

        .ctrl-btn {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 18px;
            height: 45px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .ctrl-btn:active {
            background: var(--primary);
            border-color: var(--primary-hover);
            transform: scale(0.95);
        }

        .ctrl-up { grid-column: 2; }
        .ctrl-left { grid-column: 1; }
        .ctrl-down { grid-column: 2; }
        .ctrl-right { grid-column: 3; }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Yılan Oyunu</h1>
        <p class="subtitle">Klasik Retro Yılan</p>

        <div class="scoreboard">
            <div class="score-item">Skor <span id="score">0</span></div>
            <div class="score-item">En Yüksek <span id="highScore">0</span></div>
        </div>

        <canvas id="gameCanvas" width="360" height="360"></canvas>

        <!-- Mobiller İçin Dokunmatik Kontroller -->
        <div class="controls">
            <button class="ctrl-btn ctrl-up" id="btnUp">▲</button>
            <button class="ctrl-btn ctrl-left" id="btnLeft">◀</button>
            <button class="ctrl-btn ctrl-down" id="btnDown">▼</button>
            <button class="ctrl-btn ctrl-right" id="btnRight">▶</button>
        </div>

        <button class="btn" id="startBtn">Oyunu Başlat / Yeniden Başlat</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highScoreEl = document.getElementById("highScore");
        const startBtn = document.getElementById("startBtn");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let apple = { x: 5, y: 5 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snake_high_score") || 0;
        let gameInterval = null;
        let isGameRunning = false;

        highScoreEl.textContent = highScore;

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            scoreEl.textContent = score;
            spawnApple();
        }

        function spawnApple() {
            apple.x = Math.floor(Math.random() * tileCount);
            apple.y = Math.floor(Math.random() * tileCount);
            
            snake.forEach(part => {
                if (part.x === apple.x && part.y === apple.y) {
                    spawnApple();
                }
            });
        }

        function gameLoop() {
            update();
            if (checkGameOver()) {
                clearInterval(gameInterval);
                isGameRunning = false;
                alert("Oyun Bitti! Skorun: " + score);
                return;
            }
            draw();
        }

        function update() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === apple.x && head.y === apple.y) {
                score += 10;
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem("snake_high_score", highScore);
                }
                spawnApple();
            } else {
                snake.pop();
            }
        }

        function checkGameOver() {
            const head = snake[0];
            
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }

            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        function draw() {
            ctx.fillStyle = "#050505";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ef4444";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ef4444";
            ctx.fillRect(apple.x * gridSize, apple.y * gridSize, gridSize - 2, gridSize - 2);

            ctx.fillStyle = "#22c55e";
            ctx.shadowColor = "#22c55e";
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#16a34a" : "#22c55e";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
            ctx.shadowBlur = 0;
        }

        function changeDirection(newDx, newDy) {
            if (!isGameRunning) return;
            if (newDx !== -dx && newDy !== -dy) {
                dx = newDx;
                dy = newDy;
            }
        }

        document.addEventListener("keydown", e => {
            switch (e.key) {
                case "ArrowUp":
                case "w":
                case "W":
                    changeDirection(0, -1);
                    break;
                case "ArrowDown":
                case "s":
                case "S":
                    changeDirection(0, 1);
                    break;
                case "ArrowLeft":
                case "a":
                case "A":
                    changeDirection(-1, 0);
                    break;
                case "ArrowRight":
                case "d":
                case "D":
                    changeDirection(1, 0);
                    break;
            }
        });

        document.getElementById("btnUp").addEventListener("click", () => changeDirection(0, -1));
        document.getElementById("btnDown").addEventListener("click", () => changeDirection(0, 1));
        document.getElementById("btnLeft").addEventListener("click", () => changeDirection(-1, 0));
        document.getElementById("btnRight").addEventListener("click", () => changeDirection(1, 0));

        function startGame() {
            if (gameInterval) clearInterval(gameInterval);
            initGame();
            isGameRunning = true;
            gameInterval = setInterval(gameLoop, 100);
        }

        startBtn.addEventListener("click", startGame);
        draw();
    </script>
</body>
</html>
