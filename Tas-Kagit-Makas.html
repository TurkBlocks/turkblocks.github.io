<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taş Kağıt Makas</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --surface-2: #141414;
            --border: #222222;
            --text: #f8f9fa;
            --text-secondary: #9ca3af;
            --primary: #500000;
            --primary-hover: #780000;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Google Sans", Arial, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        h1 { font-size: 24px; margin-bottom: 4px; }
        .subtitle { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: var(--surface-2);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .score-item { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; }
        .score-item span { display: block; font-size: 18px; font-weight: 700; color: var(--text); margin-top: 2px; }

        .arena {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #050505;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            font-size: 36px;
        }

        .choice-box span {
            font-size: 11px;
            color: var(--text-secondary);
            display: block;
            margin-top: 5px;
        }

        .result-text {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            min-height: 20px;
        }

        .choices {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .choice-btn {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px 0;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .choice-btn:hover {
            background: var(--primary);
            border-color: var(--primary-hover);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Taş Kağıt Makas</h1>
        <p class="subtitle">Bilgisayara Karşı Yarış</p>

        <div class="scoreboard">
            <div class="score-item">Sen <span id="playerScore">0</span></div>
            <div class="score-item">Berabere <span id="drawScore">0</span></div>
            <div class="score-item">Bot <span id="botScore">0</span></div>
        </div>

        <div class="arena">
            <div class="choice-box">
                <div id="playerChoice">❔</div>
                <span>Sen</span>
            </div>
            <div style="font-size: 16px; color: var(--text-secondary);">VS</div>
            <div class="choice-box">
                <div id="botChoice">❔</div>
                <span>Bot</span>
            </div>
        </div>

        <div class="result-text" id="resultText">Seçimini yap ve kapışmayı başlat!</div>

        <div class="choices">
            <button class="choice-btn" onclick="play('rock')">✊</button>
            <button class="choice-btn" onclick="play('paper')">✋</button>
            <button class="choice-btn" onclick="play('scissors')">✌️</button>
        </div>
    </div>

    <script>
        let pScore = 0, dScore = 0, bScore = 0;
        const emojis = { rock: "✊", paper: "✋", scissors: "✌️" };

        function play(playerSelection) {
            const options = ["rock", "paper", "scissors"];
            const botSelection = options[Math.floor(Math.random() * options.length)];

            document.getElementById("playerChoice").textContent = emojis[playerSelection];
            document.getElementById("botChoice").textContent = emojis[botSelection];

            let result = "";

            if (playerSelection === botSelection) {
                dScore++;
                result = "Berabere!";
                document.getElementById("resultText").style.color = "var(--text-secondary)";
            } else if (
                (playerSelection === "rock" && botSelection === "scissors") ||
                (playerSelection === "paper" && botSelection === "rock") ||
                (playerSelection === "scissors" && botSelection === "paper")
            ) {
                pScore++;
                result = "Kazandın! 🎉";
                document.getElementById("resultText").style.color = "#22c55e";
            } else {
                bScore++;
                result = "Kaybettin! 😢";
                document.getElementById("resultText").style.color = "#ef4444";
            }

            document.getElementById("playerScore").textContent = pScore;
            document.getElementById("drawScore").textContent = dScore;
            document.getElementById("botScore").textContent = bScore;
            document.getElementById("resultText").textContent = result;
        }
    </script>
</body>
</html>
