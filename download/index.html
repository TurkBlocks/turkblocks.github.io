<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>İndir - TÜRKBLOCKS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            color-scheme: light dark;

            --bg: #000000;
            --surface: #111111;
            --surface-hover: #181818;
            --text: #ffffff;
            --muted: #a5a5a5;
            --border: #292929;
            --accent: #500000;
            --accent-hover: #700000;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f7f7f7;
                --surface: #ffffff;
                --surface-hover: #eeeeee;
                --text: #111111;
                --muted: #666666;
                --border: #dddddd;
                --accent: #500000;
                --accent-hover: #680000;
            }
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: var(--bg);
            color: var(--text);

            font-family:
                "Google Sans",
                Arial,
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        header {
            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;

            min-height: 76px;
            padding: 14px 28px;

            background: color-mix(
                in srgb,
                var(--bg) 88%,
                transparent
            );

            backdrop-filter: blur(18px);

            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: inline-flex;
            align-items: center;

            gap: 11px;

            font-size: 21px;
            font-weight: 700;

            letter-spacing: 1px;
        }

        .brand-logo {
            width: 35px;
            height: 35px;

            object-fit: contain;
        }

        /* RGB - soldan sağa */

        .brand-text {
            position: relative;
            color: var(--text);

            transition: color .25s ease;
        }

        .brand-text::after {
            content: "TÜRKBLOCKS";

            position: absolute;
            inset: 0;

            color: transparent;

            background:
                linear-gradient(
                    90deg,
                    #ff0000,
                    #ff7a00,
                    #ffff00,
                    #00ff55,
                    #00c8ff,
                    #3d5cff,
                    #b400ff,
                    #ff008c,
                    #ff0000
                );

            background-size: 300% 100%;

            background-clip: text;
            -webkit-background-clip: text;

            opacity: 0;

            pointer-events: none;
        }

        .brand:hover .brand-text {
            color: transparent;
        }

        .brand:hover .brand-text::after {
            opacity: 1;

            animation:
                rgbLeftToRight
                2.5s
                linear
                infinite;
        }

        @keyframes rgbLeftToRight {
            from {
                background-position: 0% 50%;
            }

            to {
                background-position: 300% 50%;
            }
        }

        /* =====================================================
           ANA ALAN
        ===================================================== */

        main {
            width: min(900px, calc(100% - 40px));

            margin: 0 auto;

            padding: 60px 0 80px;
        }

        .title {
            margin-bottom: 38px;
        }

        .title h1 {
            margin: 0 0 10px;

            font-size: clamp(
                32px,
                6vw,
                50px
            );

            letter-spacing: -1.5px;
        }

        .title p {
            margin: 0;

            color: var(--muted);

            font-size: 16px;
        }

        /* =====================================================
           PLATFORM KARTLARI
        ===================================================== */

        .platforms {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px;
        }

        .platform {
            display: flex;
            flex-direction: column;

            padding: 25px;

            border: 1px solid var(--border);
            border-radius: 18px;

            background: var(--surface);

            transition:
                transform .2s ease,
                background .2s ease,
                border-color .2s ease;
        }

        .platform:hover {
            transform: translateY(-4px);

            background: var(--surface-hover);

            border-color: var(--accent);
        }

        .platform-top {
            display: flex;
            align-items: center;

            gap: 17px;

            margin-bottom: 25px;
        }

        /*
         * Windows/Linux görselleri.
         *
         * Buradaki src değerlerini kendi ikon/link
         * görsellerinle değiştirebilirsin.
         */

        .platform-logo {
            width: 58px;
            height: 58px;

            object-fit: contain;

            flex-shrink: 0;
        }

        .platform-name {
            margin: 0;

            font-size: 24px;
            font-weight: 600;
        }

        .platform-description {
            margin: 0 0 25px;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.5;
        }

        .download-button {
            display: block;

            width: 100%;

            margin-top: auto;

            padding: 13px 18px;

            border: 1px solid var(--accent);
            border-radius: 11px;

            background: var(--accent);
            color: #ffffff;

            text-align: center;

            font-size: 15px;
            font-weight: 500;

            transition:
                background .2s ease,
                transform .2s ease;
        }

        .download-button:hover {
            background: var(--accent-hover);

            transform: translateY(-2px);
        }

        .download-button:active {
            transform: scale(.98);
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            padding: 25px 20px 35px;

            border-top: 1px solid var(--border);

            color: var(--muted);

            text-align: center;

            font-size: 13px;
        }

        /* =====================================================
           MOBİL
        ===================================================== */

        @media (max-width: 700px) {

            header {
                padding: 12px 16px;
            }

            .brand {
                font-size: 18px;
            }

            .brand-logo {
                width: 31px;
                height: 31px;
            }

            main {
                width: calc(100% - 28px);

                padding-top: 40px;
            }

            .platforms {
                grid-template-columns: 1fr;
            }
        }

        /* =====================================================
           HAREKET AZALTMA
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header>

        <a
            class="brand"
            href="/"
            aria-label="TürkBlocks ana sayfa"
        >

            <img
                class="brand-logo"
                src="https://turkblocks.gamer.gd/logo/6642781985798787256865186887954381688697668781534687987679868154396796545368967453.png"
                alt="TürkBlocks"
            >

            <span class="brand-text">
                TÜRKBLOCKS
            </span>

        </a>

    </header>


    <!-- =====================================================
         DOWNLOAD
    ===================================================== -->

    <main>

        <section class="title">

            <h1>
                TÜRKBLOCKS
            </h1>

            <p>
                İşletim sistemin için TürkBlocks'u indir.
            </p>

        </section>


        <section class="platforms">

            <!-- =================================================
                 LINUX
            ================================================== -->

            <article class="platform">

                <div class="platform-top">

                    <!-- Linux görseli -->
                    <img
                        class="platform-logo"
                        src="https://upload.wikimedia.org/wikipedia/commons/3/35/Tux.svg"
                        alt="Linux"
                    >

                    <h2 class="platform-name">
                        Linux
                    </h2>

                </div>


                <p class="platform-description">
                    Linux için TürkBlocks sürümü.
                </p>


                <a
                    class="download-button"
                    href="https://turkblocks.gamer.gd/download/ftp/turkblocks.x86_64"
                    download
                >
                    İndir
                </a>

            </article>


            <!-- =================================================
                 WINDOWS
            ================================================== -->

            <article class="platform">

                <div class="platform-top">

                    <!-- Windows görseli -->
                    <img
                        class="platform-logo"
                        src="https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Windows_logo_-_2021.svg/960px-Windows_logo_-_2021.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail&_=20220927154043"
                        alt="Windows"
                    >

                    <h2 class="platform-name">
                        Windows
                    </h2>

                </div>


                <p class="platform-description">
                    Windows için TürkBlocks sürümü.
                </p>


                <a
                    class="download-button"
                    href="https://turkblocks.gamer.gd/download/ftp/turkblocks.exe"
                    download
                >
                    İndir
                </a>

            </article>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <footer>
        © TürkBlocks
    </footer>

</body>
</html>
