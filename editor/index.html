<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TürkBlocks Studio</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --red: #500000;
        --red-light: #700000;
        --black: #0b0b0b;
        --dark: #111111;
        --panel: #171717;
        --panel-2: #1d1d1d;
        --border: #303030;
        --text: #f5f5f5;
        --muted: #a8a8a8;
        --selected: rgba(80, 0, 0, .32);
    }

    body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        font-family: "Google Sans", "Segoe UI", Arial, sans-serif;
        background: var(--black);
        color: var(--text);
    }

    button,
    input,
    select {
        font-family: inherit;
    }

    button {
        cursor: pointer;
    }

    /* TOP BAR */

    .topbar {
        height: 58px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 16px;
        background: #101010;
        border-bottom: 1px solid var(--border);
        user-select: none;
    }

    .brand {
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -.3px;
        min-width: 185px;
    }

    .brand span {
        color: #c98b8b;
    }

    .top-actions {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .top-button {
        border: 1px solid var(--border);
        background: #191919;
        color: #eee;
        padding: 9px 14px;
        border-radius: 10px;
        transition: .15s;
    }

    .top-button:hover {
        background: #252525;
        border-color: #555;
    }

    .top-button.primary {
        background: var(--red);
        border-color: var(--red);
    }

    .top-button.primary:hover {
        background: var(--red-light);
    }

    .project-name {
        margin-left: auto;
        color: var(--muted);
        font-size: 13px;
    }

    /* MAIN */

    .editor {
        height: calc(100vh - 58px);
        display: grid;
        grid-template-columns: 225px 1fr 285px;
    }

    /* LEFT PANEL */

    .left-panel,
    .right-panel {
        background: var(--panel);
        overflow: hidden;
    }

    .left-panel {
        border-right: 1px solid var(--border);
    }

    .right-panel {
        border-left: 1px solid var(--border);
    }

    .panel-title {
        height: 48px;
        display: flex;
        align-items: center;
        padding: 0 15px;
        font-size: 14px;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
    }

    .node-list {
        height: calc(100% - 48px);
        overflow-y: auto;
        padding: 10px;
    }

    .node-category {
        color: #929292;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .8px;
        padding: 8px 7px;
    }

    .node-item {
        height: 40px;
        display: flex;
        align-items: center;
        padding: 0 11px;
        margin-bottom: 5px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: #1d1d1d;
        color: #ededed;
        cursor: grab;
        user-select: none;
        transition: .15s;
    }

    .node-item:hover {
        background: #272727;
        border-color: #3b3b3b;
        transform: translateX(2px);
    }

    .node-item:active {
        cursor: grabbing;
    }

    .node-dot {
        width: 8px;
        height: 8px;
        background: #8d8d8d;
        border-radius: 50%;
        margin-right: 10px;
    }

    .node-item.character .node-dot {
        background: #b65c5c;
    }

    .node-item.block .node-dot {
        background: #777;
    }

    .node-item.camera .node-dot {
        background: #aaa;
    }

    /* CENTER */

    .workspace {
        position: relative;
        overflow: hidden;
        background:
            linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
            #0e0e0e;
        background-size: 24px 24px;
    }

    .workspace.drag-over {
        background-color: #151010;
    }

    .workspace-info {
        position: absolute;
        top: 14px;
        left: 16px;
        padding: 7px 10px;
        border-radius: 8px;
        background: rgba(0,0,0,.55);
        border: 1px solid #282828;
        color: #777;
        font-size: 11px;
        pointer-events: none;
    }

    .origin {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1px;
        height: 1px;
        pointer-events: none;
    }

    .origin::before,
    .origin::after {
        content: "";
        position: absolute;
        background: rgba(255,255,255,.12);
    }

    .origin::before {
        width: 100vw;
        height: 1px;
        left: -50vw;
    }

    .origin::after {
        width: 1px;
        height: 100vh;
        top: -50vh;
    }

    /* SCENE NODES */

    .scene-node {
        position: absolute;
        min-width: 110px;
        min-height: 52px;
        padding: 10px 13px;
        border-radius: 11px;
        background: #242424;
        border: 1px solid #444;
        box-shadow: 0 5px 18px rgba(0,0,0,.28);
        cursor: move;
        user-select: none;
        z-index: 5;
    }

    .scene-node:hover {
        border-color: #777;
    }

    .scene-node.selected {
        border: 2px solid #8e3535;
        background: #2a1717;
        box-shadow: 0 0 0 3px rgba(80,0,0,.25);
    }

    .scene-node-title {
        font-size: 13px;
        font-weight: 600;
    }

    .scene-node-type {
        margin-top: 4px;
        font-size: 10px;
        color: #999;
    }

    .scene-node.character {
        min-width: 125px;
        min-height: 62px;
    }

    .character-controls {
        margin-top: 5px;
        font-size: 9px;
        color: #c98b8b;
    }

    /* RIGHT PANEL */

    .inspector {
        height: 100%;
        overflow-y: auto;
    }

    .inspector-empty {
        padding: 28px 18px;
        color: #777;
        text-align: center;
        font-size: 13px;
        line-height: 1.6;
    }

    .inspector-section {
        padding: 14px;
        border-bottom: 1px solid var(--border);
    }

    .section-title {
        font-size: 11px;
        color: #999;
        text-transform: uppercase;
        letter-spacing: .7px;
        margin-bottom: 12px;
    }

    .field {
        margin-bottom: 12px;
    }

    .field:last-child {
        margin-bottom: 0;
    }

    .field label {
        display: block;
        font-size: 11px;
        color: #aaa;
        margin-bottom: 6px;
    }

    .field input,
    .field select {
        width: 100%;
        height: 36px;
        padding: 0 10px;
        color: #eee;
        background: #101010;
        border: 1px solid #333;
        border-radius: 9px;
        outline: none;
    }

    .field input:focus,
    .field select:focus {
        border-color: #744040;
    }

    .position-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .delete-button {
        width: 100%;
        padding: 10px;
        border: 1px solid #542020;
        background: #241313;
        color: #d88b8b;
        border-radius: 9px;
    }

    .delete-button:hover {
        background: #351717;
    }

    .control-box {
        padding: 10px;
        background: #111;
        border: 1px solid #292929;
        border-radius: 9px;
    }

    .control-row {
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
        font-size: 11px;
    }

    .control-row span:first-child {
        color: #aaa;
    }

    .control-key {
        color: #eee;
        font-weight: 600;
    }

    /* SCENE TREE */

    .scene-tree {
        position: absolute;
        left: 15px;
        bottom: 15px;
        width: 185px;
        max-height: 210px;
        background: rgba(18,18,18,.94);
        border: 1px solid #303030;
        border-radius: 12px;
        overflow: hidden;
        z-index: 20;
        box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    .scene-tree-title {
        padding: 9px 11px;
        font-size: 11px;
        font-weight: 600;
        border-bottom: 1px solid #292929;
    }

    .scene-tree-list {
        max-height: 165px;
        overflow-y: auto;
        padding: 5px;
    }

    .tree-item {
        padding: 7px 8px;
        border-radius: 7px;
        font-size: 11px;
        color: #bbb;
        cursor: pointer;
    }

    .tree-item:hover {
        background: #252525;
        color: #fff;
    }

    .tree-item.active {
        background: var(--selected);
        color: #fff;
    }

    /* TOAST */

    .toast {
        position: fixed;
        left: 50%;
        bottom: 25px;
        transform: translate(-50%, 20px);
        background: #202020;
        border: 1px solid #3a3a3a;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition: .2s;
        z-index: 100;
    }

    .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
    }

    /* SCROLLBAR */

    ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
    }

    ::-webkit-scrollbar-track {
        background: transparent;
    }

    ::-webkit-scrollbar-thumb {
        background: #3b3b3b;
        border-radius: 10px;
    }

    @media (max-width: 850px) {
        .editor {
            grid-template-columns: 180px 1fr;
        }

        .right-panel {
            display: none;
        }

        .project-name {
            display: none;
        }
    }
</style>
</head>

<body>

<header class="topbar">
    <div class="brand">
        TürkBlocks <span>Studio</span>
    </div>

    <div class="top-actions">
        <button class="top-button" id="newProject">Yeni</button>
        <button class="top-button" id="saveProject">Kaydet</button>

    <div class="project-name">

</header>

<main class="editor">

    <!-- SOL PANEL -->

    <aside class="left-panel">
        <div class="panel-title">Düğümler</div>

                 draggable="true"

            <div class="node-item"
                 draggable="true"

    <!-- ÇALIŞMA ALANI -->

    <section class="workspace" id="workspace">

    <!-- INSPECTOR -->

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ==========================================
   TÜRKBlocks STUDIO
   Basit Web Tabanlı Editör
========================================== */

const workspace = document.getElementById("workspace");
const sceneTree = document.getElementById("sceneTree");
const inspector = document.getElementById("inspector");
const toast = document.getElementById("toast");

let nodes = [];
let selectedNode = null;
let nodeCounter = 0;
let draggingNode = null;
let dragOffsetX = 0;
let dragOffsetY = 0;

/* ==========================================
   TOAST
========================================== */

function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
    }, 1800);
}

/* ==========================================
   NODE DRAG FROM LEFT PANEL
========================================== */

document.querySelectorAll(".node-item").forEach(item => {

    item.addEventListener("dragstart", event => {
        event.dataTransfer.setData(
            "node-type",
            item.dataset.type
        );
    });

});

/* ==========================================
   WORKSPACE DROP
========================================== */

workspace.addEventListener("dragover", event => {
    event.preventDefault();
    workspace.classList.add("drag-over");
});

workspace.addEventListener("dragleave", event => {
    workspace.classList.remove("drag-over");
});

workspace.addEventListener("drop", event => {
    event.preventDefault();

    workspace.classList.remove("drag-over");

    const type = event.dataTransfer.getData("node-type");

    if (!type) return;

    const rect = workspace.getBoundingClientRect();

    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    createNode(type, x, y);
});

/* ==========================================
   CREATE NODE
========================================== */

function createNode(type, x, y, data = {}) {

    nodeCounter++;

    const node = {
        id: "node_" + nodeCounter,
        type: type,
        name: data.name || type,
        x: data.x ?? x,
        y: data.y ?? y,

        width: data.width || 120,
        height: data.height || 60,

        speed: data.speed || 200,
        jump: data.jump || 400,

        controls: {
            up: "W",
            left: "A",
            down: "S",
            right: "D",
            jump: "Space"
        }
    };

    nodes.push(node);

    renderNode(node);
    updateSceneTree();
    selectNode(node);

    showToast(type + " düğümü eklendi");
}

/* ==========================================
   RENDER NODE
========================================== */

function renderNode(node) {

    const element = document.createElement("div");

    element.className = "scene-node";

    if (node.type === "Character") {
        element.classList.add("character");
    }

    element.dataset.id = node.id;

    element.style.left = node.x + "px";
    element.style.top = node.y + "px";

    let extra = "";

    if (node.type === "Character") {
        extra = `
            <div class="character-controls">
                WASD + Boşluk
            </div>
        `;
    }

    element.innerHTML = `
        <div class="scene-node-title">
            ${escapeHTML(node.name)}
        </div>

        <div class="scene-node-type">
            ${escapeHTML(node.type)}
        </div>

        ${extra}
    `;

    workspace.appendChild(element);

    /* Seçme */

    element.addEventListener("mousedown", event => {

        if (event.button !== 0) return;

        event.stopPropagation();

        selectNode(node);

        draggingNode = node;

        const rect = element.getBoundingClientRect();
        const workspaceRect = workspace.getBoundingClientRect();

        dragOffsetX =
            event.clientX -
            rect.left;

        dragOffsetY =
            event.clientY -
            rect.top;

        element.setPointerCapture?.(event.pointerId);
    });

    return element;
}

/* ==========================================
   MOVE NODES
========================================== */

document.addEventListener("mousemove", event => {

    if (!draggingNode) return;

    const element =
        workspace.querySelector(
            `[data-id="${draggingNode.id}"]`
        );

    if (!element) return;

    const rect =
        workspace.getBoundingClientRect();

    let x =
        event.clientX -
        rect.left -
        dragOffsetX;

    let y =
        event.clientY -
        rect.top -
        dragOffsetY;

    x = Math.max(0, x);
    y = Math.max(0, y);

    draggingNode.x = x;
    draggingNode.y = y;

    element.style.left = x + "px";
    element.style.top = y + "px";

    updateInspectorPosition();
});

document.addEventListener("mouseup", () => {
    draggingNode = null;
});

/* ==========================================
   SELECT NODE
========================================== */

function selectNode(node) {

    selectedNode = node;

    document
        .querySelectorAll(".scene-node")
        .forEach(el => {
            el.classList.toggle(
                "selected",
                el.dataset.id === node.id
            );
        });

    updateSceneTree();
    renderInspector();
}

/* ==========================================
   DESELECT
========================================== */

workspace.addEventListener("mousedown", event => {

    if (
        event.target === workspace ||
        event.target.classList.contains("origin")
    ) {
        selectedNode = null;

        document
            .querySelectorAll(".scene-node")
            .forEach(el =>
                el.classList.remove("selected")
            );

        renderInspector();
        updateSceneTree();
    }

});

/* ==========================================
   INSPECTOR
========================================== */

function renderInspector() {

    if (!selectedNode) {

        inspector.innerHTML = `
            <div class="inspector-empty">
                Bir düğüm seç.<br>
                Özellikleri burada görünecek.
            </div>
        `;

        return;
    }

    const n = selectedNode;

    let characterControls = "";

    if (n.type === "Character") {

        characterControls = `
            <div class="inspector-section">

                <div class="section-title">
                    Kontroller
                </div>

                <div class="control-box">

                    <div class="control-row">
                        <span>Yukarı</span>
                        <span class="control-key">W</span>
                    </div>

                    <div class="control-row">
                        <span>Sol</span>
                        <span class="control-key">A</span>
                    </div>

                    <div class="control-row">
                        <span>Aşağı</span>
                        <span class="control-key">S</span>
                    </div>

                    <div class="control-row">
                        <span>Sağ</span>
                        <span class="control-key">D</span>
                    </div>

                    <div class="control-row">
                        <span>Zıplama</span>
                        <span class="control-key">Boşluk</span>
                    </div>

                </div>

            </div>

            <div class="inspector-section">

                <div class="section-title">
                    Karakter
                </div>

                <div class="field">
                    <label>Hareket Hızı</label>

                    <input
                        type="number"
                        id="speedInput"
                        value="${n.speed}"
                    >
                </div>

                <div class="field">
                    <label>Zıplama Gücü</label>

                    <input
                        type="number"
                        id="jumpInput"
                        value="${n.jump}"
                    >
                </div>

            </div>
        `;
    }

    inspector.innerHTML = `

        <div class="inspector-section">

            <div class="section-title">
                Düğüm
            </div>

            <div class="field">

                <label>Ad</label>

                <input
                    type="text"
                    id="nameInput"
                    value="${escapeAttribute(n.name)}"
                >

            </div>

            <div class="field">

                <label>Tür</label>

                <input
                    type="text"
                    value="${escapeAttribute(n.type)}"
                    disabled
                >

            </div>

        </div>

        <div class="inspector-section">

            <div class="section-title">
                Konum
            </div>

            <div class="position-grid">

                <div class="field">
                    <label>X</label>

                    <input
                        type="number"
                        id="xInput"
                        value="${Math.round(n.x)}"
                    >
                </div>

                <div class="field">
                    <label>Y</label>

                    <input
                        type="number"
                        id="yInput"
                        value="${Math.round(n.y)}"
                    >
                </div>

            </div>

        </div>

        ${characterControls}

        <div class="inspector-section">

            <button
                class="delete-button"
                id="deleteNode">
                Düğümü Sil
            </button>

        </div>
    `;

    /* İsim */

    document
        .getElementById("nameInput")
        .addEventListener("input", event => {

            n.name = event.target.value;

            refreshNodeElement(n);
            updateSceneTree();

        });

    /* X */

    document
        .getElementById("xInput")
        .addEventListener("input", event => {

            n.x = Number(event.target.value) || 0;

            refreshNodeElement(n);

        });

    /* Y */

    document
        .getElementById("yInput")
        .addEventListener("input", event => {

            n.y = Number(event.target.value) || 0;

            refreshNodeElement(n);

        });

    /* Character */

    if (n.type === "Character") {

        document
            .getElementById("speedInput")
            .addEventListener("input", event => {
                n.speed =
                    Number(event.target.value) || 0;
            });

        document
            .getElementById("jumpInput")
            .addEventListener("input", event => {
                n.jump =
                    Number(event.target.value) || 0;
            });
    }

    /* Delete */

    document
        .getElementById("deleteNode")
        .addEventListener("click", () => {
            deleteNode(n);
        });
}

/* ==========================================
   UPDATE POSITION IN INSPECTOR
========================================== */

function updateInspectorPosition() {

    if (!selectedNode) return;

    const x = document.getElementById("xInput");
    const y = document.getElementById("yInput");

    if (x) x.value = Math.round(selectedNode.x);
    if (y) y.value = Math.round(selectedNode.y);
}

/* ==========================================
   REFRESH NODE
========================================== */

function refreshNodeElement(node) {

    const old =
        workspace.querySelector(
            `[data-id="${node.id}"]`
        );

    if (!old) return;

    old.style.left = node.x + "px";
    old.style.top = node.y + "px";

    old.querySelector(".scene-node-title")
        .textContent = node.name;
}

/* ==========================================
   DELETE NODE
========================================== */

function deleteNode(node) {

    const element =
        workspace.querySelector(
            `[data-id="${node.id}"]`
        );

    if (element) {
        element.remove();
    }

    nodes = nodes.filter(
        n => n.id !== node.id
    );

    selectedNode = null;

    updateSceneTree();
    renderInspector();

    showToast("Düğüm silindi");
}

/* ==========================================
   SCENE TREE
========================================== */

function updateSceneTree() {

    if (nodes.length === 0) {

        sceneTree.innerHTML = `
            <div style="
                padding:8px;
                color:#666;
                font-size:11px;">
                Henüz düğüm yok
            </div>
        `;

        return;
    }

    sceneTree.innerHTML = "";

    nodes.forEach(node => {

        const item =
            document.createElement("div");

        item.className = "tree-item";

        if (
            selectedNode &&
            selectedNode.id === node.id
        ) {
            item.classList.add("active");
        }

        item.textContent =
            node.name;

        item.addEventListener("click", () => {
            selectNode(node);
        });

        sceneTree.appendChild(item);
    });
}

/* ==========================================
   SAVE
========================================== */

document
    .getElementById("saveProject")
    .addEventListener("click", () => {

        const project = {
            version: 1,
            name: "Yeni TürkBlocks Projesi",
            nodes: nodes
        };

        localStorage.setItem(
            "turkblocksStudioProject",
            JSON.stringify(project)
        );

        showToast("Proje kaydedildi");
    });

/* ==========================================
   LOAD
========================================== */

document
    .getElementById("loadProject")
    .addEventListener("click", () => {

        const saved =
            localStorage.getItem(
                "turkblocksStudioProject"
            );

        if (!saved) {
            showToast("Kayıtlı proje bulunamadı");
            return;
        }

        const project =
            JSON.parse(saved);

        clearWorkspace();

        nodes = [];

        project.nodes.forEach(data => {

            nodeCounter++;

            const node = {
                ...data,
                id: "node_" + nodeCounter
            };

            nodes.push(node);
            renderNode(node);
        });

        updateSceneTree();

        showToast("Proje açıldı");
    });

/* ==========================================
   NEW PROJECT
========================================== */

document
    .getElementById("newProject")
    .addEventListener("click", () => {

        if (nodes.length > 0) {

            const confirmNew =
                confirm(
                    "Mevcut proje temizlensin mi?"
                );

            if (!confirmNew) return;
        }

        clearWorkspace();

        nodes = [];
        selectedNode = null;
        nodeCounter = 0;

        updateSceneTree();
        renderInspector();

        showToast("Yeni proje oluşturuldu");
    });

/* ==========================================
   CLEAR WORKSPACE
========================================== */

function clearWorkspace() {

    workspace
        .querySelectorAll(".scene-node")
        .forEach(el => el.remove());
}

/* ==========================================
   PREVIEW
========================================== */

document
    .getElementById("previewProject")
    .addEventListener("click", () => {

        if (nodes.length === 0) {
            showToast("Önizlemek için düğüm ekle");
            return;
        }

        showToast(
            "Önizleme sistemi sonraki sürümde"
        );
    });

/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function escapeAttribute(value) {
    return escapeHTML(value);
}

/* ==========================================
   KEYBOARD
========================================== */

document.addEventListener("keydown", event => {

    if (!selectedNode) return;

    /* Input alanındaysak silme çalışmasın */

    if (
        event.target.tagName === "INPUT" ||
        event.target.tagName === "TEXTAREA"
    ) {
        return;
    }

    /* Delete */

    if (event.key === "Delete") {
        deleteNode(selectedNode);
    }

    /* Character seçiliyse hareket testi */

    if (selectedNode.type === "Character") {

        const step = 5;

        if (event.key === "w" ||
            event.key === "W") {

            selectedNode.y -= step;
        }

        if (event.key === "s" ||
            event.key === "S") {

            selectedNode.y += step;
        }

        if (event.key === "a" ||
            event.key === "A") {

            selectedNode.x -= step;
        }

        if (event.key === "d" ||
            event.key === "D") {

            selectedNode.x += step;
        }

        refreshNodeElement(selectedNode);
        updateInspectorPosition();
    }
});

/* ==========================================
   INITIAL
========================================== */

updateSceneTree();
renderInspector();

</script>

</body>
</html>
