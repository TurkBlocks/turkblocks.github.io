<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TürkBlocks Studio</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #d9d9d9;
    color: #222;
}

/* ÜST MENÜ */
.topbar {
    height: 48px;
    background: linear-gradient(#650000, #450000);
    border-bottom: 2px solid #250000;
    display: flex;
    align-items: center;
    padding: 0 10px;
    color: white;
    box-shadow: 0 1px 4px #555;
}

.logo {
    font-size: 19px;
    font-weight: bold;
    margin-right: 22px;
    text-shadow: 1px 1px #250000;
}

.menu {
    display: flex;
    height: 100%;
}

.menu button {
    height: 32px;
    margin: 8px 3px;
    padding: 0 13px;
    border: 1px solid #300000;
    border-radius: 4px;
    background: linear-gradient(#790000, #500000);
    color: white;
    cursor: pointer;
    font-size: 13px;
}

.menu button:hover {
    background: linear-gradient(#900000, #600000);
}

/* ANA ALAN */
.main {
    display: flex;
    height: calc(100vh - 48px);
}

/* SOL PANEL */
.left-panel {
    width: 220px;
    background: #eeeeee;
    border-right: 1px solid #999;
    box-shadow: inset -1px 0 #fff;
    overflow-y: auto;
}

.panel-title {
    background: linear-gradient(#eeeeee, #cccccc);
    border-bottom: 1px solid #999;
    padding: 9px 10px;
    font-size: 13px;
    font-weight: bold;
    color: #333;
}

.node-list {
    padding: 8px;
}

.node {
    padding: 8px 9px;
    margin-bottom: 5px;
    border: 1px solid #aaa;
    border-radius: 4px;
    background: linear-gradient(#fff, #e2e2e2);
    box-shadow: 0 1px 2px #bbb;
    cursor: grab;
    font-size: 13px;
    user-select: none;
}

.node:hover {
    border-color: #700000;
    background: #f8eeee;
}

.node:active {
    cursor: grabbing;
}

/* ÇALIŞMA ALANI */
.workspace {
    flex: 1;
    position: relative;
    overflow: hidden;
    background-color: #cfcfcf;

    background-image:
        linear-gradient(#bdbdbd 1px, transparent 1px),
        linear-gradient(90deg, #bdbdbd 1px, transparent 1px);

    background-size: 20px 20px;
}

.workspace-header {
    position: absolute;
    left: 10px;
    top: 10px;
    z-index: 5;

    background: #eeeeee;
    border: 1px solid #999;
    border-radius: 4px;
    padding: 6px 9px;

    font-size: 12px;
    color: #555;
}

/* SAHNEDEKİ NESNELER */
.scene-object {
    position: absolute;
    min-width: 90px;
    min-height: 45px;

    border: 2px solid #500000;
    border-radius: 4px;

    background: #ffffff;
    box-shadow: 2px 2px 4px rgba(0,0,0,.3);

    cursor: move;
    user-select: none;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;
    font-weight: bold;
}

.scene-object.selected {
    border: 2px dashed #500000;
    box-shadow: 0 0 0 2px rgba(80,0,0,.25);
}

.scene-object.character {
    background: #f3dddd;
}

.scene-object.block {
    background: #dddddd;
}

.scene-object.enemy {
    background: #ead7d7;
}

/* SAĞ PANEL */
.right-panel {
    width: 270px;
    background: #eeeeee;
    border-left: 1px solid #999;
    overflow-y: auto;
}

.inspector {
    padding: 10px;
}

.inspector-section {
    border: 1px solid #aaa;
    border-radius: 4px;
    background: white;
    margin-bottom: 10px;
    box-shadow: 0 1px 2px #bbb;
}

.inspector-title {
    padding: 7px;
    background: linear-gradient(#eeeeee, #d0d0d0);
    border-bottom: 1px solid #aaa;
    font-weight: bold;
    font-size: 12px;
}

.inspector-content {
    padding: 8px;
}

.field {
    margin-bottom: 8px;
}

.field label {
    display: block;
    font-size: 11px;
    color: #555;
    margin-bottom: 3px;
}

.field input,
.field select {
    width: 100%;
    height: 28px;
    border: 1px solid #999;
    border-radius: 3px;
    padding: 4px 6px;
    background: #fff;
}

/* SAHNE AĞACI */
.tree {
    padding: 8px;
}

.tree-item {
    padding: 6px 8px;
    border: 1px solid transparent;
    border-radius: 3px;
    font-size: 12px;
    cursor: pointer;
}

.tree-item:hover {
    background: #e8d5d5;
    border-color: #c4a0a0;
}

.tree-item.active {
    background: #500000;
    color: white;
}

/* ALT DURUM ÇUBUĞU */
.statusbar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 26px;

    background: linear-gradient(#eeeeee, #cccccc);
    border-top: 1px solid #999;

    display: flex;
    align-items: center;
    padding: 0 8px;

    font-size: 11px;
    color: #444;
}

.empty {
    padding: 15px;
    font-size: 12px;
    color: #777;
    text-align: center;
}

/* DÜĞME */
.small-button {
    width: 100%;
    height: 30px;

    border: 1px solid #777;
    border-radius: 4px;

    background: linear-gradient(#fff, #d7d7d7);

    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
}

.small-button:hover {
    background: linear-gradient(#fff, #c8c8c8);
}

.danger {
    color: #800000;
}
</style>
</head>

<body>

<!-- ÜST MENÜ -->
<div class="topbar">

    <div class="logo">
        TürkBlocks Studio
    </div>

    <div class="menu">
        <button onclick="newProject()">Yeni</button>
        <button onclick="saveProject()">Kaydet</button>
        <button onclick="loadProject()">Aç</button>
        <button onclick="previewGame()">▶ Önizle</button>
        <button onclick="exportTBP()">TBP Dışa Aktar</button>
    </div>

</div>

<div class="main">

    <!-- SOL -->
    <aside class="left-panel">

        <div class="panel-title">
            Düğümler
        </div>

        <div class="node-list" id="nodeList">

            <div class="node" draggable="true" data-type="Character">
                Character
            </div>

            <div class="node" draggable="true" data-type="Engel">
                Engel
            </div>

            <div class="node" draggable="true" data-type="Blok">
                Blok
            </div>

            <div class="node" draggable="true" data-type="Kamera">
                Kamera
            </div>

            <div class="node" draggable="true" data-type="Düşman">
                Düşman
            </div>

            <div class="node" draggable="true" data-type="NPC">
                NPC
            </div>

            <div class="node" draggable="true" data-type="Eşya">
                Eşya
            </div>

            <div class="node" draggable="true" data-type="Kapı">
                Kapı
            </div>

            <div class="node" draggable="true" data-type="Spawn">
                Spawn
            </div>

            <div class="node" draggable="true" data-type="Checkpoint">
                Checkpoint
            </div>

            <div class="node" draggable="true" data-type="Metin">
                Metin
            </div>

            <div class="node" draggable="true" data-type="Buton">
                Buton
            </div>

            <div class="node" draggable="true" data-type="Ses">
                Ses
            </div>

            <div class="node" draggable="true" data-type="Parçacık">
                Parçacık
            </div>

            <div class="node" draggable="true" data-type="Alan">
                Alan
            </div>

        </div>

    </aside>

    <!-- ORTA -->
    <main class="workspace" id="workspace">

        <div class="workspace-header">
            2D Çalışma Alanı
        </div>

        <div class="statusbar" id="statusbar">
            Hazır — Bir düğümü sürükleyerek çalışma alanına bırakın.
        </div>

    </main>

    <!-- SAĞ -->
    <aside class="right-panel">

        <div class="panel-title">
            Sahne Ağacı
        </div>

        <div class="tree" id="sceneTree">

            <div class="tree-item active">
                Ana Sahne
            </div>

        </div>

        <div class="panel-title">
            Inspector
        </div>

        <div class="inspector" id="inspector">

            <div class="empty">
                Bir düğüm seçin.
            </div>

        </div>

    </aside>

</div>


<script>

let objects = [];
let selectedObject = null;
let objectCounter = 0;
let draggingObject = null;
let offsetX = 0;
let offsetY = 0;


/* DÜĞÜMLERİ SÜRÜKLE */
document.querySelectorAll(".node").forEach(node => {

    node.addEventListener("dragstart", event => {

        event.dataTransfer.setData(
            "nodeType",
            node.dataset.type
        );

    });

});


/* ÇALIŞMA ALANINA BIRAK */
const workspace = document.getElementById("workspace");

workspace.addEventListener("dragover", event => {
    event.preventDefault();
});

workspace.addEventListener("drop", event => {

    event.preventDefault();

    const type =
        event.dataTransfer.getData("nodeType");

    if (!type) return;

    const rect =
        workspace.getBoundingClientRect();

    const x =
        event.clientX - rect.left;

    const y =
        event.clientY - rect.top;

    createObject(type, x, y);

});


/* NESNE OLUŞTUR */
function createObject(type, x, y) {

    objectCounter++;

    const object = document.createElement("div");

    object.className =
        "scene-object";

    object.textContent = type;

    object.style.left =
        x + "px";

    object.style.top =
        y + "px";

    object.dataset.id =
        objectCounter;

    object.dataset.type =
        type;

    if (type === "Character")
        object.classList.add("character");

    if (type === "Blok")
        object.classList.add("block");

    if (type === "Düşman")
        object.classList.add("enemy");

    workspace.appendChild(object);

    objects.push({
        id: objectCounter,
        type: type,
        x: x,
        y: y,
        width: 90,
        height: 45
    });

    setupObject(object);

    selectObject(object);

    updateStatus(
        type + " oluşturuldu."
    );
}


/* NESNE DAVRANIŞLARI */
function setupObject(object) {

    object.addEventListener("mousedown", event => {

        event.stopPropagation();

        selectObject(object);

        draggingObject = object;

        const rect =
            object.getBoundingClientRect();

        offsetX =
            event.clientX - rect.left;

        offsetY =
            event.clientY - rect.top;

    });

}


/* NESNEYİ SÜRÜKLE */
document.addEventListener("mousemove", event => {

    if (!draggingObject) return;

    const rect =
        workspace.getBoundingClientRect();

    let x =
        event.clientX -
        rect.left -
        offsetX;

    let y =
        event.clientY -
        rect.top -
        offsetY;

    x = Math.max(0, x);
    y = Math.max(0, y);

    draggingObject.style.left =
        x + "px";

    draggingObject.style.top =
        y + "px";

    const id =
        Number(draggingObject.dataset.id);

    const data =
        objects.find(o => o.id === id);

    if (data) {

        data.x = x;
        data.y = y;

    }

});


document.addEventListener("mouseup", () => {

    draggingObject = null;

});


/* NESNE SEÇ */
function selectObject(object) {

    document.querySelectorAll(
        ".scene-object"
    ).forEach(obj => {

        obj.classList.remove("selected");

    });

    object.classList.add("selected");

    selectedObject = object;

    updateInspector(object);

    updateTree(object);
}


/* INSPECTOR */
function updateInspector(object) {

    const type =
        object.dataset.type;

    const data =
        objects.find(
            o => o.id === Number(object.dataset.id)
        );

    let html = "";

    html += `
        <div class="inspector-section">

            <div class="inspector-title">
                ${type}
            </div>

            <div class="inspector-content">

                <div class="field">
                    <label>Ad</label>
                    <input
                        value="${type}"
                        onchange="renameObject(this.value)"
                    >
                </div>

                <div class="field">
                    <label>X</label>
                    <input
                        type="number"
                        value="${Math.round(data.x)}"
                        onchange="changePosition('x', this.value)"
                    >
                </div>

                <div class="field">
                    <label>Y</label>
                    <input
                        type="number"
                        value="${Math.round(data.y)}"
                        onchange="changePosition('y', this.value)"
                    >
                </div>

            </div>

        </div>
    `;


    if (type === "Character") {

        html += `

        <div class="inspector-section">

            <div class="inspector-title">
                Character Ayarları
            </div>

            <div class="inspector-content">

                <div class="field">
                    <label>Hareket</label>
                    <select>
                        <option>WASD</option>
                        <option>Ok Tuşları</option>
                    </select>
                </div>

                <div class="field">
                    <label>Zıplama</label>
                    <select>
                        <option>Boşluk</option>
                        <option>Devre Dışı</option>
                    </select>
                </div>

                <div class="field">
                    <label>Hız</label>
                    <input type="number" value="200">
                </div>

                <div class="field">
                    <label>Zıplama Gücü</label>
                    <input type="number" value="400">
                </div>

                <div class="field">
                    <label>Yerçekimi</label>
                    <select>
                        <option>Açık</option>
                        <option>Kapalı</option>
                    </select>
                </div>

            </div>

        </div>

        `;

    }


    html += `

        <div class="inspector-section">

            <div class="inspector-title">
                İşlemler
            </div>

            <div class="inspector-content">

                <button
                    class="small-button danger"
                    onclick="deleteSelected()"
                >
                    Düğümü Sil
                </button>

            </div>

        </div>

    `;


    document.getElementById(
        "inspector"
    ).innerHTML = html;

}


/* SAHNE AĞACI */
function updateTree(object) {

    const tree =
        document.getElementById("sceneTree");

    tree.innerHTML = `
        <div class="tree-item">
            Ana Sahne
        </div>
    `;

    objects.forEach(data => {

        const item =
            document.createElement("div");

        item.className =
            "tree-item";

        if (
            selectedObject &&
            Number(selectedObject.dataset.id)
            === data.id
        ) {

            item.classList.add("active");

        }

        item.textContent =
            data.type;

        item.onclick = () => {

            const obj =
                document.querySelector(
                    '[data-id="' + data.id + '"]'
                );

            if (obj)
                selectObject(obj);

        };

        tree.appendChild(item);

    });

}


/* POZİSYON DEĞİŞTİR */
function changePosition(axis, value) {

    if (!selectedObject) return;

    const number =
        Number(value);

    selectedObject.style[axis] =
        number + "px";

    const data =
        objects.find(
            o =>
            o.id ===
            Number(selectedObject.dataset.id)
        );

    if (data)
        data[axis] = number;

}


/* İSİM DEĞİŞTİR */
function renameObject(name) {

    if (!selectedObject) return;

    selectedObject.textContent =
        name;

}


/* SEÇİLİYİ SİL */
function deleteSelected() {

    if (!selectedObject) return;

    const id =
        Number(selectedObject.dataset.id);

    selectedObject.remove();

    objects =
        objects.filter(
            o => o.id !== id
        );

    selectedObject = null;

    document.getElementById(
        "inspector"
    ).innerHTML =
        `<div class="empty">
            Bir düğüm seçin.
        </div>`;

    updateTree();

    updateStatus(
        "Düğüm silindi."
    );

}


/* YENİ PROJE */
function newProject() {

    if (
        objects.length > 0 &&
        !confirm("Yeni proje oluşturulsun mu?")
    ) return;

    document.querySelectorAll(
        ".scene-object"
    ).forEach(o => o.remove());

    objects = [];
    selectedObject = null;
    objectCounter = 0;

    document.getElementById(
        "inspector"
    ).innerHTML =
        `<div class="empty">
            Bir düğüm seçin.
        </div>`;

    updateTree();

    updateStatus(
        "Yeni proje oluşturuldu."
    );

}


/* KAYDET */
function saveProject() {

    const project = {
        version: 1,
        engine: "TürkBlocks Studio",
        objects: objects
    };

    localStorage.setItem(
        "turkblocks_project",
        JSON.stringify(project)
    );

    updateStatus(
        "Proje tarayıcıya kaydedildi."
    );

}


/* AÇ */
function loadProject() {

    const saved =
        localStorage.getItem(
            "turkblocks_project"
        );

    if (!saved) {

        alert("Kayıtlı proje bulunamadı.");
        return;

    }

    newProject();

    const project =
        JSON.parse(saved);

    project.objects.forEach(data => {

        createObject(
            data.type,
            data.x,
            data.y
        );

    });

    updateStatus(
        "Proje yüklendi."
    );

}


/* ÖNİZLEME */
function previewGame() {

    alert(
        "TürkBlocks Studio önizlemesi yakında burada çalışacak."
    );

}


/* TBP */
function exportTBP() {

    const project = {
        format: "TBP",
        version: 1,
        engine: "TürkBlocks Studio",
        objects: objects
    };

    const blob =
        new Blob(
            [JSON.stringify(project, null, 2)],
            {
                type: "application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "turkblocks-project.tbp";

    a.click();

    URL.revokeObjectURL(url);

    updateStatus(
        "TBP dışa aktarıldı."
    );

}


/* DURUM */
function updateStatus(message) {

    document.getElementById(
        "statusbar"
    ).textContent =
        message;

}


/* ÇALIŞMA ALANINA TIKLAMA */
workspace.addEventListener(
    "mousedown",
    event => {

        if (
            event.target === workspace
        ) {

            document.querySelectorAll(
                ".scene-object"
            ).forEach(obj =>
                obj.classList.remove(
                    "selected"
                )
            );

            selectedObject = null;

            document.getElementById(
                "inspector"
            ).innerHTML =
                `<div class="empty">
                    Bir düğüm seçin.
                </div>`;

        }

    }
);

</script>

</body>
</html>
