<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TürkBlocks</title>

    <meta
        name="description"
        content="TürkBlocks hakkında bilgi."
    >

    <style>
        :root {
            --black: #000000;
            --red: #500000;
            --red-light: #730000;
            --text: #ffffff;
            --muted: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #000000;

            color: var(--text);

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            overflow: hidden;
        }

        /* Arka plan ışığı */

        body::before {
            content: "";

            position: fixed;

            width: 550px;
            height: 550px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background:
                rgba(80, 0, 0, 0.12);

            filter: blur(110px);

            pointer-events: none;

            animation: glow 5s ease-in-out infinite;
        }

        /* İçerik */

        .container {
            position: relative;

            z-index: 2;

            width: min(750px, calc(100% - 35px));

            text-align: center;

            padding: 20px;
        }

        .brand {
            color: #ffffff;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 5px;

            text-transform: uppercase;

            margin-bottom: 22px;

            opacity: 0;

            animation:
                rise 0.8s
                cubic-bezier(.2,.8,.2,1)
                0.1s forwards;
        }

        h1 {
            font-size:
                clamp(48px, 9vw, 86px);

            line-height: 1;

            letter-spacing: -3px;

            font-weight: 850;

            margin-bottom: 24px;

            opacity: 0;

            animation:
                rise 0.9s
                cubic-bezier(.2,.8,.2,1)
                0.25s forwards;
        }

        h1 span {
            color: var(--red-light);
        }

        .description {
            max-width: 650px;

            margin: auto;

            color: var(--muted);

            font-size: 17px;

            line-height: 1.8;

            opacity: 0;

            animation:
                rise 0.9s
                cubic-bezier(.2,.8,.2,1)
                0.4s forwards;
        }

        /* Alt çizgi */

        .line {
            width: 70px;
            height: 3px;

            margin: 30px auto 0;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--red),
                    transparent
                );

            opacity: 0;

            animation:
                rise 0.8s
                cubic-bezier(.2,.8,.2,1)
                0.55s forwards;
        }

        /* Animasyonlar */

        @keyframes rise {
            from {
                opacity: 0;

                transform:
                    translateY(45px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        @keyframes glow {
            0%,
            100% {
                opacity: 0.7;

                transform:
                    translate(-50%, -50%)
                    scale(0.95);
            }

            50% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1.08);
            }
        }

        /* Seçim */

        ::selection {
            background: var(--red);

            color: #ffffff;
        }

        /* Mobil */

        @media (max-width: 600px) {

            body {
                overflow-y: auto;
            }

            .container {
                width:
                    calc(100% - 24px);

                padding: 15px;
            }

            .brand {
                font-size: 11px;

                letter-spacing: 3px;

                margin-bottom: 18px;
            }

            h1 {
                font-size: 48px;

                letter-spacing: -2px;

                margin-bottom: 18px;
            }

            .description {
                font-size: 15px;

                line-height: 1.7;
            }

            .line {
                margin-top: 25px;
            }
        }

        @media (max-width: 380px) {

            h1 {
                font-size: 42px;
            }

            .description {
                font-size: 14px;
            }
        }

        /* Hareket azaltma */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="brand">
            TürkBlocks
        </div>

        <h1>
            Lütfen Sayfayı <span>Yazın!</span>
        </h1>

        <p class="description">
            Şartlar sayfasındasınız ancak buradan bir şart
            belgesine gidemezsiniz. lütfen direkt sayfayı yazın.
            Mesela: turkblocks.github.io/sartlar/test gibi yazın.
         </p>

        <div class="line"></div>

    </main>

</body>
</html>
